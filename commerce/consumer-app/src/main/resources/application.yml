spring:
  application:
    name: be-commerce-consumer
  main:
    web-application-type: none          # 웹서버 없는 경량 워커
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: be-commerce-settlement-notifier
      auto-offset-reset: earliest       # 소비자가 늦게 떠도 기존 이벤트부터 따라잡는다
      # 값은 String으로 받고 Jackson으로 직접 파싱한다.
      # producer(메인 앱)는 ByteArraySerializer를 쓴다 — Modulith 외부화가 이벤트를 이미 JSON byte[]로
      # 직렬화해 넘기므로 와이어에는 타입 헤더(__TypeId__)가 붙지 않고 JSON 문자열만 온다. 그래서
      # String으로 받아 Jackson readTree로 파싱하는 것이 producer 내부 타입에 결합되지 않는 방식이다.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
