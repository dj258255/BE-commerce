spring:
  application:
    name: be-commerce

  # PG 정산 파일 업로드 대사용. 정산 CSV는 수만 행이어도 수 MB 수준 → 여유 있게 잡되 무제한은 아님.
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: jdbc:mysql://localhost:3306/becommerce?serverTimezone=UTC&characterEncoding=UTF-8
    username: becommerce
    password: becommerce
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 폭주 시 매달리지 않고 빠르게 실패 — 지연이 마비로 번지는 걸 차단.
    # connection-timeout 기본 30초는 폭주 시 요청 스레드가 커넥션을 기다리며 줄줄이 매달려
    # 전면 마비로 번진다. 3초 안에 못 얻으면 에러로 빠르게 떨궈 스레드를 즉시 회수한다.
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000     # 폭주 시 30초 대기 대신 3초 빠른 실패
                                   # 주의: 이건 <풀에서 커넥션을 빌리려고 기다리는> 상한이다.
                                   # 이미 빌린 커넥션의 점유 시간은 못 막는다 —
                                   # 그건 payment.toss.read-timeout 이 맡는다.
      validation-timeout: 2000

  jpa:
    hibernate:
      ddl-auto: validate        # 스키마는 마이그레이션으로 관리, JPA는 검증만 (원장 append-only 보호)
    properties:
      hibernate:
        format_sql: true
        # 느린 쿼리를 로그로 남긴다(단위: ms). 임계 초과 시 WARN + 실행된 SQL을 함께 찍는다.
        #
        # 왜 필요한가: 아웃박스 완료 처리가 15만 행을 매번 풀스캔하고 있었는데, 그걸
        # <우연히> 찾았다. 부하 실험 결과가 회차마다 달라 원인을 쫓다 DB를 열어보고서야 알았다
        # (성능 리포트 10절). 성능 리포트는 병목 계측 방법으로 slow query 로그를 적어두고 있었지만
        # 정작 켜져 있지 않았다. 같은 일이 또 나면 또 우연에 기대야 한다.
        #
        # 300ms를 고른 이유: 이 서비스의 결제 승인 p95가 무릎 아래(도착률 100/s)에서 수십~수백 ms다
        # (성능 리포트 12절). 개별 쿼리가 300ms를 넘으면 그건 요청 하나가 통째로 느려질 만한
        # 크기이므로, 정상 트래픽에서는 거의 안 찍히고 이상할 때만 찍힌다.
        # 너무 낮으면 로그가 시끄러워 아무도 안 보게 되고, 너무 높으면 오늘 같은 풀스캔을 놓친다.
        # 프로퍼티 이름 주의: Hibernate 6.1까지는
        # session.events.log.LOG_QUERIES_SLOWER_THAN_MS 였고 6.2에서 log_slow_query로 바뀌었다.
        # 이 프로젝트는 Hibernate 7.4이므로 아래가 맞다. 옛 이름을 쓰면 <조용히 무시된다>.
        log_slow_query: ${APP_SLOW_QUERY_MS:300}
        jdbc:
          time_zone: UTC
    open-in-view: false          # OSIV 비활성화 — 긴 트랜잭션/커넥션 점유 방지 (카카오페이 성능 개선 교훈)

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false          # Redis는 캐시·분산락 용도만 — JPA 리포지토리를 Redis가 넘보는 store-detection 경고 제거

  # 스키마는 Flyway가 관리한다 (원장 append-only 보호를 위해 JPA는 validate만)
  flyway:
    enabled: true
    baseline-on-migrate: true

  # Kafka 외부화용. 기본은 빈 값 → 브로커 없이도 앱이 뜬다. 운영/데모는 KAFKA_BOOTSTRAP로 주입.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:}

  # Spring Modulith Event Publication Registry (= Transactional Outbox) 를 JPA로 영속화
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false         # event_publication은 Flyway(V1)가 생성한다
      republish-outstanding-events-on-restart: true   # 미완료 이벤트 재시도
      # 완료된 이벤트를 event_publication_archive로 옮긴다(기본값 update = 행을 영원히 남김).
      # 이유: 기본값이면 발행량에 비례해 outbox가 무한히 자란다. 부하 실험 6회 만에 150,372행이
      # 됐고, 완료 처리 쿼리(serialized_event + listener_id 등치)가 그 전체를 풀스캔했다
      # — 즉 결제 지연이 "그동안 처리한 이벤트 총량"에 비례해 나빠진다(V24 참고).
      # archive는 감사 흔적을 버리지 않으면서(delete와 다름) 핫 테이블에 크기 상한을 준다.
      completion-mode: archive
      externalization:
        # 기본 off. 브로커가 없으면 @Externalized 이벤트를 Kafka로 내보내지 않는다
        # → 브로커 없이 부팅/테스트가 깨지지 않고, Outbox 기반 인프로세스 소비는 그대로 동작한다.
        # 운영/데모에서 kafka 프로파일로 켠다(아래 --- kafka 문서 참고).
        enabled: false

  # 우아한 종료(graceful shutdown) — SIGTERM을 받으면 새 요청은 받지 않고(수용 중단),
  # 진행 중인 결제 요청은 완료까지 드레이닝한 뒤 종료한다(배포 시 인플라이트 결제 강제 중단 방지).
  # 드레이닝이 아래 timeout-per-shutdown-phase(20초)를 넘기면 남은 요청을 끊고 강제 종료한다.
  lifecycle:
    timeout-per-shutdown-phase: 20s

# 폭주 시 스레드 무한 증식 대신 상한 — 초과 유입은 컨테이너 수용 큐에서 대기·거절되어
# 힙/컨텍스트 스위칭 폭발로 번지지 않는다(기본 200 → 100, DB 풀 20과 균형).
server:
  # SIGTERM 시 새 요청은 안 받고 진행 중 결제는 완료까지 드레이닝(위 timeout 안에서). 최대 대기 후 강제 종료.
  # (k8s면 LB 디레지스터 경합을 없애려 preStop sleep 지연도 필요하나, 단일 프로세스라 여기선 설정만 둔다.)
  shutdown: graceful
  tomcat:
    threads:
      max: 100
    # 이걸 켜야 tomcat_threads_busy_threads 가 Prometheus 에 나간다. 기본값은 off 라
    # <워커가 얼마나 묶였는지>를 볼 지표 자체가 없었다. PG 가 느려지면 마르는 자리가
    # DB 커넥션이 아니라 여기라서(ADR-022 실측), 안 보이면 안 되는 지표다.
    mbeanregistry:
      enabled: ${SERVER_TOMCAT_MBEANREGISTRY:true}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, modulith, prometheus
  metrics:
    tags:
      application: be-commerce
    distribution:
      # HTTP 요청 지연을 히스토그램 버킷으로 발행 → Prometheus에서 p95/p99를
      # histogram_quantile로 서버측 집계(대시보드의 "요청 p99 레이턴시" 소스).
      # 버킷을 안 켜면 _count/_sum/_max만 나와 분위수 산출이 불가능하다.
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    org.springframework.modulith: INFO

# 애플리케이션 시크릿 — 운영에서는 반드시 환경변수/시크릿 매니저로 주입한다.
# 아래 값은 로컬 개발 전용 기본값(env가 우선). 코드에는 키를 두지 않는다.
app:
  batch:
    # <b>배치 한 번이 읽는 최대 행 수.</b> 이 값이 없을 때는 조건에 맞는 것을 전부 List 로
    # 올렸다. 평소에는 하루치라 작지만 배치가 며칠 밀리거나 물량이 튀면 그만큼 커지고,
    # 그때 죽는 것은 돈을 다루는 배치다. 실측으로 확인했다 — 500건이 쌓이면 500건을
    # 한 번에 읽었다(UnboundedBatchReadIntegrationTest).
    #
    # 남은 것은 다음 주기가 가져간다. 한 번에 다 비우지 않는 이유는 <b>실패한 건이
    # 대상에 남기 때문</b>이다. 비울 때까지 도는 구조로 만들면 영영 안 끝나는 건 하나가
    # 배치를 붙잡는다. 틱당 일이 일정한 편이 부하도 예측된다.
    read-chunk-size: ${APP_BATCH_READ_CHUNK:500}

    # <b>정산 배치가 한 틱에 읽는 최대 페이지 수.</b> 틱당 처리량 상한은 이 값 × read-chunk-size 다.
    #
    # 예전에는 한 장만 읽었다. 정산 틱은 24시간에 한 번이고 같은 날짜 재실행은 판매자별로
    # 멱등 skip 되므로, <b>확정이 하루 500건을 넘으면 남는 양이 매일 쌓이고 지연 일수가 무한히
    # 커진다.</b> 트래픽의 성질이 아니라 코드가 정한 천장이었다(ADR-023).
    #
    # 그렇다고 빌 때까지 돌면 위 주석의 근거가 깨진다 — 영영 안 끝나는 건 하나가 배치를 붙잡는다.
    # 그래서 상한을 둔다. 20 × 500 = 틱당 1만 건이고, 상한에 닿으면
    # settlement.batch.page_cap_reached 로 남는다.
    settlement-max-pages: ${APP_BATCH_SETTLEMENT_MAX_PAGES:20}

  # 상담 답변 초안 (ADR-014). 기본은 외부 호출이 없는 템플릿.
  webhook:
    # 웹훅이 승인 응답보다 먼저 도착한 건을 다시 처리한다. 기본 off — 다른 배치와 같은 규약.
    pending-retry:
      enabled: ${APP_WEBHOOK_PENDING_RETRY_ENABLED:false}
    pending-interval-ms: ${APP_WEBHOOK_PENDING_INTERVAL_MS:5000}
    pending-max-retry: ${APP_WEBHOOK_PENDING_MAX_RETRY:12}

  assist:
    # template | ollama | anthropic
    #   template  — 외부 호출 없음. 기준선이자 폴백
    #   ollama    — 로컬 모델. 데이터가 기계 밖으로 안 나간다
    #   anthropic — 외부 API. BYOK(운영자가 자기 키를 넣는다).
    #               생성형 AI 는 아직 금융권 망분리 예외가 아니다 — 켜는 것은 의식적 선택이어야 한다
    # <b>기본값을 ollama 로 바꿨다.</b> 편집률 45% 의 원인은 프롬프트 배치가 아니었다.
    # 초안을 열어 보니 문장은 깔끔한데 <금액이 아예 없었다>(13 문서 실험 14).
    # 루브릭이 금액 결손을 안 보고 있어서 되묻기가 발동하지 않던 것을 이었다.
    # 새 사례 12건에서 <b>금액 결손 67% → 0%</b>. 용어 누출과 출처 없는 숫자는
    # 되묻기 전후 모두 0% 라 되묻기가 고친 것이 아니고, 활성화 조건을 넘긴 값이다.
    # <b>활성화 조건 넷을 다 넘겼다.</b> 1번인 편집률은 12건 3단계 블라인드 리뷰에서
    # 모델이 템플릿보다 낮았다. <b>다만 수치는 재현되지 않는다.</b> 같은 12건을 두 번
    # 돌려 모델 33.5%·71.1%, 템플릿 85.0%·87.0% 가 나왔다(13 문서 2회차 절).
    # 조건 1(템플릿보다 낮은가)은 두 번 다 통과했지만 <b>모델 쪽이 두 배 넘게 벌어져서</b>
    # 이 자리의 근거는 <b>방향뿐이고 점 추정치가 아니다.</b> 33.5% 를 성능으로 인용하면
    # 안 된다. 그리고 그 리뷰어가 이 프롬프트를 만든 사람이라, 수치를 쓰려면 애초에
    # 다른 사람이 다시 재야 한다.
    # 지연은 로컬에서 흔들려(p95 12.1초) 예산 안에 못 들어오면 템플릿으로 떨어진다.
    draft-provider: ${APP_ASSIST_DRAFT_PROVIDER:ollama}
    # 장애 로그 원인 분석. rule | ollama | rule-first
    #   rule       — 규칙만. 실 로그 12건에서 맞음 7·기권 5·틀림 0. 아는 것만 답한다
    #   ollama     — 모델만. 맞음 11·기권 0·틀림 1. 규칙이 확실히 답하던 7건까지 오답 위험에 노출된다
    #   rule-first — 규칙이 먼저 답하고 <기권한 자리에만> 모델. 맞음 11·기권 0·틀림 1
    # 기본값이 rule-first 인 이유: 규칙이 답한 7건은 모델을 안 거치면서 답을 4건 더 얻는다.
    # 모델이 낸 답은 IncidentDiagnosis.source() 가 MODEL 로 표시하며 확정은 사람이 한다.
    incident-provider: ${APP_ASSIST_INCIDENT_PROVIDER:rule-first}
    # 확정 시 초안을 만들어 <기록만> 한다. 사람에게 보여주지 않아 앵커링이 생기지 않는다.
    # 기본 꺼짐 — 확정마다 타임라인 조립(10개 도메인) 비용이 붙는다.
    shadow-enabled: ${APP_ASSIST_SHADOW_ENABLED:false}
    # FDS 심사 초안. template | ollama
    # <b>기본이 template 인 이유</b>: 켤 근거가 아직 없다. 상황 3.2 의 상담 초안은 블라인드
    # 비교로 템플릿보다 수정량이 적은 것을 보고 켰는데, 이 자리는 그 표본이 0 건이다.
    # 구성을 정한 것과 기능이 도는 것은 다른 일이라, 근거 없이 기본값을 ollama 로 두지 않는다.
    fraud-review-provider: ${APP_ASSIST_FRAUD_REVIEW_PROVIDER:template}
    # <b>모델을 돌릴지는 provider 와 따로 정한다.</b> 켤 근거인 블라인드 비교 표본을 쌓으려면
    # 모델이 돌아야 하는데, provider 하나로 둘을 정하면 표본을 모으는 순간 화면도 같이 바뀐다.
    # 근거를 모으기도 전에 켜 버리는 셈이다. 탐지 모델을 섀도로 돌리는 것과 같은 구조다.
    # 켜면 블라인드 비교에서 모델 초안이 만들어지고, 심사 화면에는 여전히 템플릿이 나간다.
    fraud-review-model-enabled: ${APP_ASSIST_FRAUD_REVIEW_MODEL_ENABLED:false}
    ollama:
      # 심사 초안 모델을 빈으로 띄울지. 위 fraud-review-model-enabled 와 같은 뜻이고
      # @ConditionalOnProperty 가 보는 경로다.
      fraud-review-enabled: ${APP_ASSIST_FRAUD_REVIEW_MODEL_ENABLED:false}
      base-url: ${APP_ASSIST_OLLAMA_BASE_URL:http://localhost:11434}
      model: ${APP_ASSIST_OLLAMA_MODEL:qwen3:14b}
      narrative-model: ${APP_ASSIST_OLLAMA_NARRATIVE_MODEL:qwen3:8b}
      # 심사 초안도 8b 를 쓴다. <b>성능이 아니라 모델 교체 때문이다.</b> ollama 는 기본으로
      # 한 번에 한 모델만 올려 두는데, 자리마다 모델이 다르면 부를 때마다 9.3GB 를 내리고
      # 올린다. 그 적재 시간이 예산을 통째로 먹어 열두 건 중 다섯이 타임아웃이었다.
      # 같은 프롬프트로 재면 14b 8.9초 · 8b 9.4초로 <b>생성 속도는 차이가 없다.</b>
      # 하는 일도 사실을 다섯 문장으로 옮겨 적는 것이라 서술과 같은 급이다.
      fraud-review-model: ${APP_ASSIST_OLLAMA_FRAUD_REVIEW_MODEL:qwen3:8b}
      # 읽기 타임아웃. <b>실측으로 정했다</b>(18 문서 11절). 그 전에는 코드에 박힌 기본값이
      # 서술 60초 · 장애분석 120초로 서로 달랐고, 그 숫자를 아무도 정한 적이 없었다.
      #
      #   템플릿        p50 0ms
      #   모델 순차      p50 8.8s · p95 12.7s
      #   모델 동시 4    p50 30.3s · p95 31.6s
      #
      # 60초로 두면 동시 요청이 몰릴 때 운영자 화면이 30초 넘게 멈춘 채 기다린다.
      # 타임아웃이 걸리면 템플릿으로 떨어지므로 <b>기다리는 것보다 떨어지는 편이 낫다.</b>
      # 15초는 순차 p95(12.7s)는 살리고 동시 적체(30s+)는 끊는 자리다.
      timeout-seconds: ${APP_ASSIST_OLLAMA_TIMEOUT_SECONDS:15}
      # 장애 로그 분석은 성격이 다르다. 운영자가 로그를 붙여 넣고 결과를 기다리는
      # 명시적 동작이라 화면 렌더링과 예산이 같지 않다. 대신 폴백이 없어 시간이 지나면
      # 그냥 빈손이므로, 무한정 늘리지 않는다.
      incident-timeout-seconds: ${APP_ASSIST_OLLAMA_INCIDENT_TIMEOUT_SECONDS:30}
      # 상담 초안도 <운영자가 누르고 기다리는> 명시적 동작이라 화면 렌더링과 예산이 같지 않다.
      # 위 15초는 타임라인 서술(화면에 같이 뜨는 것)을 기준으로 정한 값이라, 초안에 그대로
      # 쓰던 것이 <분류 실수>였다. 장애 로그 분석과 같은 30초로 뗀다.
      # 초안은 금액이 빠지면 한 번 더 되묻기 때문에 호출이 둘이다.
      draft-timeout-seconds: ${APP_ASSIST_OLLAMA_DRAFT_TIMEOUT_SECONDS:30}
      # 심사 초안도 같은 자리인데 값을 안 떼어 둬서 위 15초를 그대로 받고 있었다.
      # 바로 위에서 상담 초안에 대해 고친 것과 <같은 분류 실수>를 한 번 더 한 것이다.
      # 재 보니 qwen3:14b 로 15~17초가 걸려 거의 매번 타임아웃이었고, 그러면 초안이
      # 한쪽만 비어 블라인드 비교가 아예 안 열린다(reveal 이 204 로 떨어진다).
      fraud-review-timeout-seconds: ${APP_ASSIST_OLLAMA_FRAUD_REVIEW_TIMEOUT_SECONDS:30}
    # 운영자용 타임라인 서술(18 문서). 어드민 화면에서 "이 주문에 무슨 일이 있었나"를
    # 한 문단으로 돌려준다. 읽기 전용이고 고객에게 나가지 않는다.
    #
    # 기본은 template — 모델 없이 사실을 시간순으로 잇기만 한다. 이 문장이 <모델이 넘어야 할
    # 자>다. 모델 서술이 이것보다 나은지 재지 않으면 "붙였다"만 남는다.
    #
    # 분류가 아니라 서술이라 이 자리에는 규칙 대비 개선이 처음부터 존재한다 —
    # 규칙은 문장을 못 쓴다. 잔여 후보(15 문서)를 끈 이유와 정확히 반대다.
    #
    # <b>기본값을 ollama 로 바꿨다(18 문서 10절).</b> 어느 쪽 문장이 더 읽히는지는 아직 못 쟀다.
    # 사람이 고른 표본이 0건이고, 강한 심판을 세워 본 26 대 4 는 템플릿이 "그다음" 사슬이라
    # 한눈에 구별돼 블라인드가 성립하지 않았다. 그러니 <더 낫다>를 근거로 켜는 것이 아니다.
    #
    # 켜는 근거는 <더 나쁠 수 없게 만들었다>다. 모델 서술이 가드에 걸리면(지어낸 숫자·빠뜨린
    # 금액) 예전에는 화면이 통째로 비었고, 금액 결손은 30건 중 0~4건으로 간헐적이라 그 확률로
    # 빈 화면을 봤다. 이제 그 자리에서 템플릿으로 떨어진다. 모델을 켠 최악이 템플릿을 켠 것과
    # 같아졌으므로, 못 잰 것이 위험으로 남지 않는다.
    #
    # 사람이 고른 25~30건이 모이면 그때 <더 나은가>를 판정한다. 그 전까지는 이 상태다.
    narrative-provider: ${APP_ASSIST_NARRATIVE_PROVIDER:ollama}
    # 규칙 분류기가 <결정적 후보를 못 낸> 건에만 모델이 원인을 제안한다(14 문서).
    # 제안까지만 한다 — resolve 는 사람이 한다.
    #
    # <b>기본 off 로 되돌렸다(15 문서).</b> 켠 유형은 INTERNAL_RECORD_LOST 하나였는데,
    # 홀드아웃을 재고 나서 그 하나마저 모델이 필요 없다는 것이 드러났다.
    #
    #   - 프롬프트가 켠 유형만 보여주므로 모델의 답은 그 값 아니면 기권 둘뿐이다
    #   - 그 값이 통과하는 조건은 대사 결과가 EXTERNAL_ONLY 일 때다(가드 8)
    #   - 그런데 그 조건에서 규칙 분류기가 이미 같은 값을 낸다
    #
    # 즉 모델이 할 수 있는 최선이 <규칙에 동의하는 것>이라, 규칙 대비 얻는 것이 없다.
    # 후보 모델을 올릴 때 기준이 되는 것은 절대 정확도가 아니라 <기존 방식 대비 개선>인데,
    # 그 값이 0 이다. 평가 하네스(./gradlew evalTest)와 가드는 남겨 둔다 —
    # 규칙이 못 가르는 유형을 열 수 있게 되면 그때 다시 켠다.
    residual-provider: ${APP_ASSIST_RESIDUAL_PROVIDER:template}
    residual:
      # 후보를 만들되 화면에 안 주는 비율. 비교군을 만들기 위해서다.
      # 제안을 보여준 건만 모으면 "제안 덕분"과 "원래 그랬을 것"을 가를 수 없다.
      # 0 이면 비교군이 없어 채택률만 남고, 그 숫자는 앵커링에 오염돼 있다.
      blind-percent: ${APP_ASSIST_RESIDUAL_BLIND_PERCENT:20}
      # 이 값 미만이면 기권한다. 규칙이 못 가른 건은 어려운 건이라,
      # 아무거나 고르면 확인하는 사람의 일이 오히려 는다.
      min-confidence: ${APP_ASSIST_RESIDUAL_MIN_CONFIDENCE:70}
    # 제안을 화면에 안 띄우고 기록만 해 사람의 확정과 대조한다(Ramp 섀도 모드).
    #
    # <b>껐다.</b> 한 번 켰다가 되돌린 것이라 이유를 적어 둔다. 섀도는 <승격 후보를
    # 재는 관문>이지 상시 상태가 아니다. 재서 승격하거나 내리고 걷는 것이 표준이고,
    # 켜 두는 동안 추론 비용은 두 배로 든다.
    # 그런데 여기엔 승격할 후보가 없다. `causeMenu()` 가 ENABLED 로 걸러서 모델이 낼 수
    # 있는 값은 INTERNAL_RECORD_LOST 아니면 기권 둘뿐이고, 그 자리는 규칙이 이미 답한다
    # (15 문서 6절). 재도 규칙과 같은 값이 나오는 것을 확인할 뿐이라 <올릴 곳이 없다.>
    # 관문은 이미 통과 못 했다 — 홀드아웃 45건에서 기권해야 할 유형이 세 모델 모두 0/15 였다.
    # 규칙이 못 가르는 유형을 열 수 있게 되면 그때 이 스위치로 먼저 잰다.
    residual-shadow-enabled: ${APP_ASSIST_RESIDUAL_SHADOW_ENABLED:false}
    # 초안이 <근거 없이 단정>하는지 다른 계열 모델에게 묻는다(ADR-014).
    # 기본 꺼짐 — 호출이 한 번 더 늘어난다. 켤 때는 초안 모델과 다른 계열이어야 한다.
    judge:
      enabled: ${APP_ASSIST_JUDGE_ENABLED:false}
      model: ${APP_ASSIST_JUDGE_MODEL:llama3.1:8b}
    anthropic:
      # 비워 두면 provider=anthropic 일 때 기동이 막힌다. 호출 시점에 실패하면
      # 초안이 조용히 비어 나가고 아무도 모른다.
      api-key: ${APP_ASSIST_ANTHROPIC_API_KEY:}
      model: ${APP_ASSIST_ANTHROPIC_MODEL:claude-sonnet-5}
  crypto:
    # 평문 하위호환을 끝내는 스위치. 재암호화가 끝나 crypto.legacy.plaintext.reads 가
    # 0이 된 뒤 true 로 켠다. 그러면 남아 있던 평문이 조용히 통과하지 않고 실패한다.
    # 지표와 스위치가 같이 있어야 "언젠가 다 됐겠지"로 끝나지 않는다.
    fail-on-legacy-plaintext: ${APP_CRYPTO_FAIL_ON_LEGACY_PLAINTEXT:false}
    key: ${APP_CRYPTO_KEY:devlocalkey_0123456789abcdef0123}   # (단일 키·AesGcmFieldCipher용) AES-256=32바이트, 운영은 KMS/env
    # 필드 암호화 방식: envelope(기본, DEK/KEK) | simple(단일 키 AesGcm).
    # envelope은 데이터를 매번 새 DEK로 암호화하고 그 DEK를 KEK(마스터키)로 감싸(wrap) 함께 저장한다.
    # → 키 로테이션 시 데이터 전체 재암호화 없이 작은 DEK만 새 KEK로 재-wrap한다(EnvelopeFieldCipher.rewrapToCurrent).
    # 운영에서는 아래 kek를 실 KMS(AWS KMS/Vault)로 옮겨 keyFor 구현만 교체한다(마스터키를 프로세스 밖에 보관).
    # 주의: envelope 암호문은 wrap된 DEK를 함께 실어 단일 키보다 길다 → 민감 컬럼 길이를 넉넉히 잡을 것.
    mode: ${APP_CRYPTO_MODE:envelope}
    kek:
      current: ${APP_KEK_CURRENT:v1}                          # 현재 wrap에 쓸 KEK 버전
      v1: ${APP_KEK_V1:kek-v1-local-0000000000000000000}      # 필수, AES-256=32바이트. 운영은 env/KMS
      v2: ${APP_KEK_V2:}                                       # 옵션(로테이션 데모). 있으면 등록, current를 v2로 올릴 수 있다
    # 블라인드 인덱스(HMAC-SHA256) secret — 암호화된 빌링키의 동등 조회·유니크를 대체한다.
    # 같은 빌링키는 항상 같은 인덱스가 되어 findByBillingKeyIndex로 찾는다. 16바이트 이상(BlindIndexer fail-fast).
    # 운영은 반드시 env/시크릿 매니저로 주입한다(아래는 로컬 개발 전용 기본값).
    blind-index-secret: ${APP_BLIND_INDEX_SECRET:blind-index-local-secret-0000000000}
  jwt:
    # HS256 대칭 서명 키. 로컬/테스트 편의로 32바이트 이상 기본값을 두되, 운영은 env로 오버라이드.
    # 런타임에 길이(<32바이트)를 검증해 약한 키로 뜨는 것을 막는다(JwtConfig fail-fast).
    secret: ${APP_JWT_SECRET:local-dev-only-please-override-with-32byte-min-secret-key}
    # access: 짧게(서명·폐기 검증만) / refresh: 길게(Redis에만 존재, 회전·폐기 가능).
    # 짧은 access + 긴 refresh로 재로그인 없이 세션을 연장하고, 폐기는 Redis denylist로 처리한다.
    access-expiry-minutes: ${APP_JWT_ACCESS_MIN:30}
    refresh-expiry-days: ${APP_JWT_REFRESH_DAYS:14}
  admin:
    password: ${APP_ADMIN_PASSWORD:admin-local-only}
  user:
    password: ${APP_USER_PASSWORD:user-local-only}
  # 멀티 PG 라우팅 — 기본 off(단일 PG). 켜면 RoutingPgClient가 pgDelegate가 되어 여러 PG를
  # 가중치 순으로 시도하고 장애 시 failover한다(TIMEOUT은 이중결제 방지로 failover 안 함).
  # PgRoutingConfig + FakePgClient의 @ConditionalOnProperty가 이 값으로 함께 토글된다.
  #
  # 켜면 POST /api/v1/payments/init 이 <결제창을 띄우기 전에> PG를 고른다. 차단기가 열린
  # PG는 후보에서 빠진다. 승인 단계 failover 가 아니다 — 결제 키는 그 PG의 결제창에서
  # 발급되므로 다른 곳에 보내면 성공률이 0이고, 진행 중 거래를 넘기면 이중결제가 난다.
  # 고르는 시점을 앞으로 옮긴 것이고, 포트원 스마트 라우팅이 channelGroupId 로 하는 것과 같은 구조다.
  pg:
    routing:
      enabled: ${APP_PG_ROUTING_ENABLED:false}
  # 이상거래탐지(FDS) 설정.
  fds:
    velocity:
      # velocity 카운터를 공유 Redis로 셀지 여부. 기본 true(RedisVelocityCounter @Primary) — 다중
      # 인스턴스에서 카운트가 정확하다. false면 InMemoryVelocityCounter로 폴백(단일 인스턴스·테스트용).
      redis: ${APP_FDS_VELOCITY_REDIS:true}
  # 보상(망취소) 재시도 스케줄러 — 기본 off(테스트/부트 부작용 방지). 운영에서 env로 켠다.
  compensation:
    enabled: ${APP_COMPENSATION_ENABLED:false}
    interval-ms: 5000

  # 아래 배치들은 로직만 있고 주기 호출자가 없던 것들 — 스케줄러를 붙여 주기 실행하고, outbox
  # 완료 이벤트도 주기 정리한다. 모두 기본 off(@ConditionalOnProperty 게이트로 테스트/부트 무영향).
  # 운영에서 env로 켠다(각 스케줄러는 짝이 되는 @EnableScheduling 게이트도 같은 프로퍼티로 함께 켜진다).

  # 미확정(UNKNOWN) 결제 복구 스케줄러 → PaymentRecoveryService.recoverUnknownPayments()
  recovery:
    enabled: ${APP_RECOVERY_ENABLED:false}
    interval-ms: 60000
    # 읽는 순서(#248, ADR-057). 확정 못 한 건(PG 진행 중·조회 실패)이 청크만큼 앞자리에 쌓이면 unordered·oldest 는
    # 뒤를 5분 동안 한 건도 못 풀었고, backoff(다음 시도를 1·2·4·8분 뒤로, 상한 10분)는 막힘 없을 때의 1.2배로 풀었다.
    policy: ${APP_RECOVERY_POLICY:backoff}
  # 멈춘 체크아웃 사가 복구 스케줄러(ADR-007) → CheckoutRecoveryService.recoverStuckCheckouts().
  # 예약(Phase1) 후 확정(Phase3) 전에 크래시로 PAYMENT_IN_PROGRESS로 멈춘 주문을 PG 조회로 완결/롤백.
  checkout:
    recovery:
      enabled: ${APP_CHECKOUT_RECOVERY_ENABLED:false}
      interval-ms: 60000
      stuck-after-minutes: ${APP_CHECKOUT_RECOVERY_STUCK_AFTER_MIN:10}
  # 가상계좌 만료 배치 스케줄러 → VirtualAccountService.expireOverdue(now)
  va:
    expiry:
      enabled: ${APP_VA_EXPIRY_ENABLED:false}
      interval-ms: 60000
  # 구독 정기결제(dunning) 스케줄러 → SubscriptionService.runBillingCycle(today). 청구 주기라 기본 1시간.
  dunning:
    enabled: ${APP_DUNNING_ENABLED:false}
    interval-ms: 3600000
  # 주문 만료 배치 스케줄러 → OrderExpiryService.expireOverdue(now) (PENDING_PAYMENT+만료시각 경과 → EXPIRED)
  order:
    expiry:
      enabled: ${APP_ORDER_EXPIRY_ENABLED:false}
      interval-ms: 60000
  # Modulith Outbox(event_publication) 완료 이벤트 정리 스케줄러 → 무한 성장 방지. 기본 1시간 주기, 7일 보존.
  outbox:
    cleanup:
      enabled: ${APP_OUTBOX_CLEANUP_ENABLED:false}
      interval-ms: 3600000
      retention-days: ${APP_OUTBOX_RETENTION_DAYS:7}
  # 멱등키(idempotency_keys) 정리 스케줄러 → 무한 성장 방지. TTL은 15일(토스페이먼츠 정합)로 그대로 두고,
  # 유효기간 지난 레코드만 주기 삭제해 15일치로 크기 유지. 기본 1시간 주기.
  idempotency:
    cleanup:
      enabled: ${APP_IDEMPOTENCY_CLEANUP_ENABLED:false}
      interval-ms: 3600000
  # 일 단위 정산 배치 스케줄러 → SettlementService.settle(전일). 하루 마감이라 기본 24시간 주기.
  # 수수료율은 bps(270=2.7%), 지급예정일은 정산일 + N영업일(주말 skip). 스케줄러는 기본 off(게이트).
  settlement:
    enabled: ${APP_SETTLEMENT_ENABLED:false}
    interval-ms: 86400000
    fee-bps: ${APP_SETTLEMENT_FEE_BPS:270}            # 수수료율(basis point) 270 = 2.7%
    payout-business-days: ${APP_SETTLEMENT_PAYOUT_DAYS:2}   # 지급예정일 = 정산일 + N영업일
    # 판매자 공정성 정책: id(기본, 전역 id 오름차순) | round-robin(판매자별 상한 + 잔여 재분배).
    #
    # 기본이 id 인 이유: 정책을 바꾸면 <b>지급일 약속이 바뀐다</b> — 기술이 아니라 사업 결정이다.
    # 대형 판매자가 하루에 받는 몫이 줄고 소형 판매자가 안 밀리는 맞바꿈이라, 실측(ADR-027)을
    # 보고 운영이 명시적으로 켠다. 꺼져 있으면 기존 동작 그대로다.
    fairness-policy: ${APP_SETTLEMENT_FAIRNESS_POLICY:id}
  # API 유입 제어(rate limit) — "감당 못 할 요청은 바깥 층에서 싸게 거절한다(429)".
  # 대상: POST /api/v1/orders, POST /api/v1/payments/confirm (RateLimitFilter, 시큐리티 체인 내
  # Bearer 인증 뒤). 고정 윈도우(1초) INCR — 경계 순간 최대 2배 통과는 단순성의 대가로 수용.
  # CDC 감시(#252). Connect REST 주소를 주면(kafka 프로파일일 때) 커넥터 상태와 하트비트 나이를 지표로 낸다.
  # 비어 있으면 감시가 뜨지 않는다. 알림 규칙은 monitoring/alert-rules.yml 의 cdc 그룹.
  cdc:
    health:
      connect-url: ${APP_CDC_HEALTH_CONNECT_URL:}
      interval: ${APP_CDC_HEALTH_INTERVAL:30s}
  # 조회 셰딩(#250, ADR-058). 진행 중인 조회가 문턱에 닿으면 새 조회를 503 으로 돌려보낸다. 웹훅·결제는 돌려보내지 않는다.
  # 조회가 DB 커넥션(20)을 다 쥐면 웹훅이 그 줄에 서서 10초 규약을 넘긴다(PG 5초 · 조회 200/s 에서 15.6%, 켜면 0%).
  # 조회 용량을 재는 벤치마크는 이 값을 false 로 두고 잰다(tools/bench.sh 등).
  web:
    browse-shed:
      enabled: ${APP_WEB_BROWSE_SHED_ENABLED:true}
      max-in-flight: ${APP_WEB_BROWSE_SHED_MAX_IN_FLIGHT:16}   # 커넥션 20 중 4 를 결제·웹훅 몫으로 남긴다
  ratelimit:
    enabled: ${APP_RATELIMIT_ENABLED:true}       # k6 전/후 비교용 스위치 — false면 필터가 전부 통과
    per-user-per-sec: ${APP_RATELIMIT_PER_USER:5}   # 사용자당 초당 허용(스크립트·이중클릭 억제)
    # 경로당 전체 초당 허용(DB로 가는 총량 캡).
    #
    # 이 100은 처음에 짐작으로 정한 값이었다. 나중에 두 번 쟀고, 답이 갈렸다(성능 리포트 9·12절).
    #
    #   닫힌 루프(ramping-vus): ~120/s → "상한이 낮다"
    #   개방 루프(constant-arrival-rate): 무릎 100~120/s → "상한이 대체로 맞다"
    #
    # 개방 루프가 맞다. 닫힌 루프는 서버가 느려지면 VU도 같이 기다려 <부하가 스스로 줄어든다>.
    # 실사용 트래픽은 우리가 느리다고 요청을 줄여주지 않는다. 그래서 12절 결론을 채택한다.
    #
    # 그래도 이 값은 맥북 로컬에서 나온 숫자다. 배포 환경마다 다시 재고 그 환경의 값으로
    # 덮어쓸 것(env APP_RATELIMIT_GLOBAL):
    #   docker compose down -v && docker compose up -d mysql redis
    #   APP_RATELIMIT_ENABLED=false ./gradlew bootRun    # 켠 채 재면 설정값을 재는 동어반복이 된다
    #   k6 run k6/capacity-knee.js
    # 스크립트가 "성공률이 온전한 마지막 단계"를 무릎으로 찍어준다. 상한은 그 근처에 둔다 —
    # 훨씬 낮으면 멀쩡한 요청을 버리고, 훨씬 높으면 상한이 아무것도 막지 못한다.
    #
    # 운영 중 판단은 지표로 한다: ratelimit_rejected_total{scope="global"}이 지속적으로 오르는데
    # 처리량이 상한보다 한참 낮으면 상한이 낮은 것이고, 상한 근처에서 평평하면 진짜 포화다.
    global-per-sec: ${APP_RATELIMIT_GLOBAL:100}

  # 선착순 대기열(Redis ZSET) — 순간 트래픽 폭증 시 DB 유입을 제어한다.
  queue:
    # 앞에서부터 이 인원(rank < admit-limit)만 "입장"시켜 결제로 보낸다 — DB 유입 제어의 상한.
    admit-limit: ${APP_QUEUE_ADMIT_LIMIT:100}
    # 입장권(admit:{eventId}:{userId}) TTL — admitted 판정 순간 발급되고, 이 시간 안에 주문까지
    # 마쳐야 한다. 만료되면 다시 status 폴링으로 재발급받으면 된다(줄에 있으면 즉시).
    pass-ttl-seconds: ${APP_QUEUE_PASS_TTL:600}
    # 대기열 게이트(옵트인): 아래 상품이 주문에 포함되면 서버가 입장권을 강제한다(권고→강제).
    # 기본 빈 목록 = 게이트 비활성 — 기존 주문 경로 100% 불변, 대상 없으면 무비용.
    gate:
      event-id: ${APP_QUEUE_GATE_EVENT:drop}       # 입장권을 검사할 이벤트 ID
      product-ids: ${APP_QUEUE_GATE_PRODUCTS:}     # 쉼표 구분 productId 목록(예: "1,2")

  # 개인화 — 온라인 컨텍스트(M2). 전달 방식이 셋인 이유는 "왜 Kafka인가"를 재기 위한 것이다:
  # 같은 적용 로직(ContextApplier)을 누가 언제 부르는지만 바꿔 비교한다.
  #
  # 기본값은 **네 번 바뀌었다.** 그 이력은 ADR-034 와 E2-e 리포트에 있다(측정이 매번 이유를 줬다).
  # 마지막 결정의 근거는 두 가지다:
  #   ① **정확성 축에서 셋이 같다** — 순서 관대 병합(#180) 뒤 order-in-process·order-kafka 둘 다 100%
  #   ② 그 위에서 **지연·운영 비용이 낮은 쪽**을 고른다 — IN_PROCESS 는 브로커가 필요 없고,
  #      e2e p95 15ms 로 KAFKA(31ms, +16ms)보다 빠르며 대기 정책 없이도 반영률 99.7% 다
  # 규칙을 하나 더 박았다: *기본값은 정확성 축이 모두 같을 때 지연·운영 비용이 낮은 쪽으로 정한다.*
  # 정확성 축이 갈리면 다시 뒤집는다 — 그게 E2 에서 배운 것이다.
  personalization:
    # KAFKA | IN_PROCESS | IN_REQUEST
    #   IN_PROCESS — 기본. 브로커 없이 뜨고 가장 빠르다(`docker compose up -d mysql redis`).
    #               순서 보장이 필요 없다 — 병합이 순서에 무관하다(ADR-035)
    #   KAFKA     — **kafka 프로파일이 있어야 동작한다**(브로커가 없으면 발행도 소비도 없어
    #               컨텍스트가 갱신되지 않는다). 프로세스 밖 소비자가 필요할 때 켠다.
    #               주의: `kafka` 프로파일 + 이 값이면 **아무도 소비하지 않는 토픽이 자란다**
    #   IN_REQUEST — 같은 트랜잭션에서 갱신. 순서는 지켜지지만 같은 사용자의 **동시 요청**은 겹친다.
    #               쓰기 경로 p95 가 셋 중 가장 높다(컨텍스트 쓰기를 같은 트랜잭션에서 지불한다)
    transport: ${APP_PERSONALIZATION_TRANSPORT:IN_PROCESS}
    # 캐시 값 저장 방식(M6·E6) — **몇 바이트를 넘을 때부터 압축하는가**.
    #
    # 캐시는 DB 조회를 없애도 네트워크·메모리 비용은 없애지 않는다. 압축은 그 둘을 줄이는 대신
    # CPU 를 쓰고, 값이 작으면 **압축 결과가 원본보다 커진다**(헤더·표식·base64 팽창 33%).
    # 그래서 임계값을 두고 그 아래는 원본을 그대로 둔다.
    #
    #   NONE  — 압축하지 않는다(기본)
    #   LZ4   — 빠르고 압축률은 낮다. 왕복이 잦은 캐시에 맞는 쪽
    #   SNAPPY— LZ4 보다 조금 낫게 줄이고 조금 느리다
    #
    # 기본이 NONE 인 이유: **적용할 캐시가 아직 없다.** E6 가 임계값을 쟀고(교차점 187~279B,
    # 1KB 에서 66% 감소 + 500KB 에서 get p99 7.5배 개선), 켤 때 쓸 값은 **SNAPPY + 1024** 다.
    # 그런데 컨텍스트 캐시(`ctx:`)는 **Lua 가 값을 읽어 병합**하므로(ADR-035) 압축을 넣을 수 없다 —
    # 첫 적용 자리는 M7 의 홈 컴포저 결과 캐시다(값이 불투명하고 크다). 판단은 ADR-041.
    cache:
      codec: ${APP_PERSONALIZATION_CACHE_CODEC:NONE}
      # 이 바이트 수 **이상**이면 압축한다. 0 이면 (코덱이 NONE 이 아닐 때) 항상 압축한다.
      # E6 측정: 187B 에서는 압축이 **손해**(저장량 1.070 — 표식 + base64 팽창), 1KB 에서는 66% 감소.
      compress-threshold-bytes: ${APP_PERSONALIZATION_CACHE_THRESHOLD:0}
    # E6 실험 계기(캐시 압축 벤치)를 켠다. **기본 off** — 이 엔드포인트는 Redis 에 값을 쓰고 지운다.
    # 실험 밖에서 열지 않는다(빈이 아예 안 만들어져 경로가 404다).
    experiment:
      enabled: ${APP_PERSONALIZATION_EXPERIMENT_ENABLED:false}
    context:
      # 컨텍스트 TTL. 컨텍스트는 영원히 유효하지 않다 — 만료되면 "아직 모른다"로 돌아간다.
      ttl: ${APP_PERSONALIZATION_CONTEXT_TTL:7d}
      # 한 사용자 컨텍스트에 담는 최근 활동 수. 무한 성장을 막는다.
      max-items: ${APP_PERSONALIZATION_CONTEXT_MAX_ITEMS:20}
      # 대기 정책의 폴링 간격과 상한. 무한 대기는 API로 열지 않는다 —
      # 상한을 넘으면 reflected=false로 정직하게 돌려준다(기다린 시간을 함께 준다).
      poll-interval-ms: ${APP_PERSONALIZATION_CONTEXT_POLL_INTERVAL_MS:10}
      max-wait-ms: ${APP_PERSONALIZATION_CONTEXT_MAX_WAIT_MS:1000}
    consumer:
      group-id: ${APP_PERSONALIZATION_CONSUMER_GROUP:be-commerce-personalization-context}
      # E1에서 consumer 지연을 주입하는 축. 기본 0이라 평소에는 비용이 없다.
      delay-ms: ${APP_PERSONALIZATION_CONSUMER_DELAY_MS:0}
  # 상점 카탈로그(#172). 패싯은 **요청마다 세지 않는다** — 실측에서 페이지 지연의 82~90% 를 차지했다.
  #
  # 무효화를 TTL로 하는 이유: 카탈로그는 **앱 밖에서** 적재된다(`pipeline/promote_products.py`).
  # 앱은 그 사건을 볼 수 없어 버전으로 즉시 무효화할 수 없다 — 그래서 TTL이고, 그 대가는
  # **TTL 창 안에서 낡은 개수를 보여주는 것**이다(숨기지 않고 ADR-044 에 적었다).
  # `0s` 로 두면 캐시를 끈다(**측정의 기준선** — 켠 것과 끈 것을 같은 하네스로 재야 한다).
  catalog:
    facets:
      cache-ttl: ${APP_CATALOG_FACETS_CACHE_TTL:60s}
      # 상한이 없으면 캐시는 메모리 누수다. 상한에 닿으면 통째로 비운다(축출 정책은 근거가 생기면).
      cache-max-entries: ${APP_CATALOG_FACETS_CACHE_MAX:200}
    # 상품 검색(ADR-051, #236). 품질을 재서 골랐다 — 오타·어형 쿼리 nDCG@10 이 LIKE 0.071, MySQL FULLTEXT 0.324,
    # 앱 안 Lucene 0.808 이었다. ES·OpenSearch 도 품질은 같았고(0.02 안), 운영 비용(컨테이너 1GB 대 앱 안 5MB)으로
    # Lucene 을 골랐다. 엔진이 실패하면 like-fields 로 물러서고 catalog.search.fallback 이 오른다.
    search:
      engine: ${APP_CATALOG_SEARCH_ENGINE:lucene}          # like · like-fields · fulltext · lucene · elasticsearch · opensearch
      engine-url: ${APP_CATALOG_SEARCH_ENGINE_URL:http://localhost:9200}
      timeout: ${APP_CATALOG_SEARCH_TIMEOUT:300ms}
      # 주기마다 통째로 다시 만든다(10만 건 1.9초). 변경 반영을 켜도 놓친 이벤트를 메우는 안전망으로 남긴다.
      lucene-refresh: ${APP_CATALOG_SEARCH_LUCENE_REFRESH:10m}
      # 변경 반영(#246, ADR-056). products·stock 의 CDC 이벤트를 받아 색인에 반영한다(p95 1.1초, 재색인만이면 최대 10분).
      # kafka 프로파일과 cdc/register-catalog-connector.json 커넥터가 있을 때만 동작한다. 없으면 리스너가 뜨지 않는다.
      # Lucene 은 인스턴스마다, ES·OpenSearch 는 색인기 하나가 받는다.
      cdc:
        enabled: ${APP_CATALOG_SEARCH_CDC_ENABLED:true}
        topic: ${APP_CATALOG_SEARCH_CDC_TOPIC:catalog.change}
      # 검색어 고치기(#260, ADR-063). 한국어 라벨 → 필터·원문 이름, 미국식 → 영국식. 한국어 0건이 10~12% 남아 기본은 끈다.
      rewrite:
        enabled: ${APP_CATALOG_SEARCH_REWRITE_ENABLED:false}
      # 변경 반영을 켰을 때 Lucene 검색기를 다시 여는 주기. 바뀐 문서가 검색에 보이기까지의 하한이다.
      lucene-nrt-refresh: ${APP_CATALOG_SEARCH_LUCENE_NRT_REFRESH:1s}
  # 홈 컴포저(M7) — 여러 출처를 **한 화면으로 조립**한다. 추천 코어는 행 하나의 재료다.
  #
  # 왜 규칙이 필요한가: 관련도만으로 채우면 **같은 상품이 여러 행에 반복되고 한 대분류가 화면을
  # 독점한다**. 그래서 조립은 관련도·다양성·정합성을 **충돌시키며** 정한다 — 셋을 동시에 만족할 수
  # 없으므로 무엇을 우선할지 고른다. 각 수준이 무엇을 잃는지는 응답의 `stats` 가 밝힌다.
  #   NONE  — 아무것도 안 한다(중복·품절 그대로). **기준선** — 규칙이 실제로 무엇을 하는지 보려면 필요하다
  #   DEDUP — 중복 제거 + 품절 제외
  #   FULL  — + 카테고리 다양성(기본). 한 대분류가 화면을 독점하지 않게 자른다
  home:
    rules: ${APP_HOME_RULES:FULL}
    # 최근 활동에서 "최근 본 상품" 행에 쓸 개수.
    context-limit: ${APP_HOME_CONTEXT_LIMIT:8}
    # 행 상한 — 화면에 담는 행 수. 늘리면 노출은 늘지만 화면이 길어지고 조립 비용도 는다.
    row-cap: ${APP_HOME_ROW_CAP:5}
    # 행당 항목 상한.
    item-cap: ${APP_HOME_ITEM_CAP:8}
    # 이보다 적은 행은 버린다 — 한 칸짜리 행은 화면에서 "빈 행"으로 보인다.
    min-items: ${APP_HOME_MIN_ITEMS:3}
    # 한 행에서 같은 대분류를 몇 개까지 허용하는가(0이면 다양성 규칙 없음).
    # **이 값이 관련도와 다양성의 교환비다** — 낮추면 상위 항목을 포기하고 카테고리가 흩어진다.
    max-per-category: ${APP_HOME_MAX_PER_CATEGORY:3}
    # 되채우기 깊이(#198①) — 규칙이 버린 칸을 **더 깊은 후보**로 채울지.
    #   1 — 항목 상한만큼만 후보를 받는다(되채우기 없음)
    #   2(기본) — 2배까지. 화면이 길어지고(측정 +12.6%) **평균 표시 순위가 내려간다**(1.18배)
    # M7c 리포트가 사전 등록 기준 셋으로 판정했다: 항목 +12.6%(≥10% 통과) · 순위 1.18배(<2배 통과) ·
    # 지연은 **폭이 차이보다 커서 판정 불가**(그래서 지연을 근거로 삼지 않는다). 그래서 기본을 2로 올렸다.
    # 적용 범위: 원천이 싼 행(최근 활동·인기 표)만. **모델 행은 그대로** — 모델에 더 요구하려면
    # result-size 를 키워야 하고 그 값이 과부하 게이트의 지연 추정에 들어가 입장 판단까지 바뀐다(E5).
    refill-depth: ${APP_HOME_REFILL_DEPTH:2}
    # 노출 기록 — 그 응답이 **무엇을 보여줬는가**(개인화 아키텍처의 "노출 이벤트").
    # **요청당 한 행**이다: 항목당이면 홈 한 번에 20행, 30req/s 에서 초당 600행이 된다(ADR-043).
    # 기록 실패는 홈을 죽이지 않는다(경고 + `home.impression.failed` 지표) — 기록은 관측이고 홈은 제품이다.
    impression-log:
      enabled: ${APP_HOME_IMPRESSION_LOG:true}
      # 보존 정책 — 없으면 하루 260만 행이 쌓인다(ADR-043의 알려진 한계였고, 여기서 닫는다).
      # 만료 행을 **배치로** 지운다: 전부를 한 트랜잭션에 지우면 그만큼 긴 잠금이 생겨 홈 조회를 막는다.
      #
      # **다른 정리 장치와 달리 기본이 on이다**(아웃박스·멱등키는 off). 이유: 표를 자라게 하는 쪽
      # (기록)이 기본 on이므로, 고치는 쪽을 off로 두면 **문서에 적어 둔 결함이 그대로 살아 있다**.
      # 부작용이 없도록 만료 행만 지우고(기본 7일) 배치·회차 상한을 둔다.
      cleanup:
        enabled: ${APP_HOME_IMPRESSION_CLEANUP:true}
        # 보존 일수 — **근거는 측정이 아니라 관례다**(아웃박스와 같은 7일). 이 표를 실제로 쓰는 사람이
        # 없어 "며칠이 맞는가"를 잴 대상이 없다. 쓰임이 생기면 그때 재서 정한다(ADR-043).
        retention-days: ${APP_HOME_IMPRESSION_RETENTION_DAYS:7}
        batch-size: ${APP_HOME_IMPRESSION_CLEANUP_BATCH:5000}
        max-batches-per-run: ${APP_HOME_IMPRESSION_CLEANUP_MAX_BATCHES:20}
        interval-ms: ${APP_HOME_IMPRESSION_CLEANUP_INTERVAL_MS:3600000}
  # 추천 서빙 — 모델 호출과 **과부하 정책**(E3의 독립변수).
  recommendation:
    # 홈의 "인기" 행을 무엇으로 채우는가(#198②) — 추천이 내놓는 값이라 여기 있다.
    #   AUTO(기본) — 인기 통계(M1 배치가 적재한 `product_popularity`)를 읽는다. 비어 있으면 폴백
    #   STRIDE     — 후보 집합에 퍼뜨리기만. **인기 신호를 켜기 전의 동작**이라 A/B 의 대조군이다
    # 폴백은 조용하지 않다: `recommendation.popular.signal.fallback` 지표 + 경고 로그가 남는다.
    popularity-source: ${APP_RECOMMENDATION_POPULARITY_SOURCE:AUTO}
    # 인기 창 — recent_7d(데이터 기준 마지막 7일) | all_time(전체). "최근"은 벽시계가 아니라
    # **데이터 기준일**이다(이 데이터는 2020-09-22 에 끝난다).
    popularity-window: ${APP_RECOMMENDATION_POPULARITY_WINDOW:recent_7d}
    # UNBOUNDED | BOUNDED | ADMISSION
    #   UNBOUNDED — 아무도 거절하지 않는다. 모델은 살아 있는데 API가 죽는다(스레드가 줄에 갇힌다)
    #   BOUNDED   — max-in-flight를 넘으면 **기다리지 않고** 포기한다
    #   ADMISSION — 대기 예상을 Little의 법칙으로 재서 예산을 넘으면 줄에 서지 않는다(기본)
    # ADR-037 이 ADMISSION 을 기본으로 정했는데 이 값은 BOUNDED 로 남아 있었다. #264 에서 맞췄다(ADR-065)
    policy: ${APP_RECOMMENDATION_POLICY:ADMISSION}
    # BOUNDED의 줄 길이 상한. 모델 동시성(4)에 여유를 더한 값 — 큐가 아니라 **여유**다.
    max-in-flight: ${APP_RECOMMENDATION_MAX_IN_FLIGHT:24}
    # ADMISSION이 허용하는 대기 예산(ms). SLO의 지연 몫과 맞춘다.
    admission-budget-ms: ${APP_RECOMMENDATION_ADMISSION_BUDGET_MS:100}
    # ADMISSION 이 대기를 어떻게 추정하나(#264). CONFIGURED = 설정한 모델 지연·동시성, OBSERVED = 최근 2초 처리량.
    # 모델의 실제 지연이 설정의 두 배일 때 CONFIGURED 는 p95 315ms(예산 100 + 지연 100 의 1.6배), OBSERVED 는 193ms 였다.
    admission-estimate: ${APP_RECOMMENDATION_ADMISSION_ESTIMATE:OBSERVED}
    # 모델에 넣을 최근 활동 수.
    context-limit: ${APP_RECOMMENDATION_CONTEXT_LIMIT:20}
    result-size: ${APP_RECOMMENDATION_RESULT_SIZE:12}
    # 모델 입력(#254). activity = 온라인 컨텍스트의 조회·클릭, purchases = 결제 완료 주문의 상품(최근 것부터).
    # GenPage 는 구매로 학습했다 — genpage 를 쓸 때는 purchases 여야 학습과 입력이 같다(ADR-053).
    history-source: ${APP_RECOMMENDATION_HISTORY_SOURCE:activity}
    purchase-history-limit: ${APP_RECOMMENDATION_PURCHASE_HISTORY_LIMIT:100}
    # 재구매 우선 혼합(#254): 최근 산 것을 중복 없이 먼저, 빈칸을 모델로. purchases 에서만 켜진다.
    repeat-first: ${APP_RECOMMENDATION_REPEAT_FIRST:false}
    # 홈 다음 쪽의 모델 입력(#270). 위 이력이 purchases 일 때(또는 실험군)만 뜻이 있다 — activity 면 지금처럼 세션을 넣는다.
    #   purchases              — 구매만. 학습과 같은 입력이다
    #   session-then-purchases — 1쪽 이후의 조회·클릭을 앞에 붙인다. 세션 반영을 살리는 대신 학습에 없던 조회가 섞인다
    # 1,000명 실측(ADR-066): 2쪽 recall 구매 0.0251 · 세션+구매 0.0191 · 세션만 0.0013, 세션 반영 0% · 12.8% · 75%
    page-history: ${APP_RECOMMENDATION_PAGE_HISTORY:purchases}
    # 추천이 **무엇을 추천할 수 있는가** — 후보 집합의 원천(M7).
    #   CATALOG   — 실제 커머스 카탈로그(기본). 홈이 상품 카드를 그릴 수 있고, 제약 확인이 실제
    #               재고를 읽는다. **이것이 "제품 연결"이다** — 추천 id 가 products 에 있어야 한다
    #   EXPERIMENT— 실험용 합성 풀(1_000_xxx). **E4·E5 하네스가 명시적으로 켠다.**
    #               변화 주입이 실제 재고를 건드리면 안 되기 때문이다(ADR-039의 격리).
    #               격리는 이제 기본값이 아니라 **하네스의 선택**으로 지켜진다(ADR-042)
    item-pool: ${APP_RECOMMENDATION_ITEM_POOL:CATALOG}
    model:
      # 모델 구현(ADR-053). stub(기본) | genpage — 작은 GenPage 모델 서버(personalization/serving/genpage_server.py).
      # genpage 는 품질 선(MAP@12 0.023354)을 못 넘어 기본으로 켜지 않았다. 켜면 추천 행과 홈 다음 쪽 행을 모델이 만든다.
      kind: ${APP_RECOMMENDATION_MODEL_KIND:stub}
      genpage-url: ${APP_RECOMMENDATION_MODEL_GENPAGE_URL:http://localhost:8765}
      # 모델 서버가 이보다 느리면 실패로 보고 물러선다(추천 행은 인기, 홈 다음 쪽은 규칙 행)
      genpage-timeout: ${APP_RECOMMENDATION_MODEL_GENPAGE_TIMEOUT:300ms}
      # 하이브리드 행 디코딩 — 행마다 앞 몇 개를 한 칸씩 생성하는가(0 = 한 번에, 8 = 전부 한 칸씩)
      genpage-prefix: ${APP_RECOMMENDATION_MODEL_GENPAGE_PREFIX:2}
      # 실험용 스텁의 **모델 용량** — 동시 처리 수와 건당 지연으로 처리량이 고정된다.
      # 이 둘을 올리면 모델이 빨라지고, 내리면 같은 부하에서 더 먼저 무너진다(E3의 부하 축).
      concurrency: ${APP_RECOMMENDATION_MODEL_CONCURRENCY:4}
      latency-ms: ${APP_RECOMMENDATION_MODEL_LATENCY_MS:50}
      # 모델 용량을 기다리는 상한. 넘으면 ModelBusyException → 폴백(UNBOUNDED에서 특히 중요하다).
      busy-timeout-ms: ${APP_RECOMMENDATION_MODEL_BUSY_TIMEOUT_MS:400}
    # 생성 범위(M5·E5) — 홈 한 페이지를 어떻게 만드는가. **모델 지연을 범위가 정한다.**
    #
    # autoregressive 생성은 앞 항목이 정해져야 다음을 만들 수 있어 **한 요청 안에서 직렬**이다.
    # 그래서 범위를 넓히면 지연이 늘고, 같은 하드웨어의 처리량(동시성/지연)이 준다.
    #   RANKING          — 후보를 한 번에 점수 매겨 상위 K. 직렬 구간 0. 항목 간 일관성은 없다(기본)
    #   PREFIX_AR_TOP_K  — 앞 ar-prefix 개만 AR, 나머지는 랭킹. 일관성이 중요한 자리만 비싸게 산다
    #   FULL_AR          — 페이지 전체를 AR. 가장 일관되지만 직렬 구간이 결과 크기에 비례한다
    #
    # 기본값이 RANKING 인 이유: 이 실험이 재는 것은 **비용**이고 품질(일관성)은 재지 않는다.
    # 근거 없이 품질을 주장하며 비싼 쪽을 켜지 않는다 — 측정 결과와 판단은 ADR-040.
    #
    # 주의: 이 값은 **과부하 정책의 대기 예상에도 쓰인다**(OverloadGate). 범위를 바꾸면 모델 지연이
    # 바뀌고, 대기 예산(admission-budget-ms)이 같은 값이어도 얼마나 받을지가 달라진다.
    generation:
      scope: ${APP_RECOMMENDATION_GENERATION_SCOPE:RANKING}
      # 앞부분 AR 로 만들 항목 수(결과 크기를 넘으면 결과 크기까지만).
      ar-prefix: ${APP_RECOMMENDATION_GENERATION_AR_PREFIX:4}
      # AR 한 항목당 추가되는 시간(스텁). 실제 모델에서는 토큰 생성 시간에 해당한다.
      per-item-ms: ${APP_RECOMMENDATION_GENERATION_PER_ITEM_MS:15}
    # 제약 확인 시점(M4·E4). 모델이 만든 목록은 **생성 중에 사실이 바뀌면** 응답 시점엔 거짓일 수 있다.
    #
    # 기본값은 E4 측정 결과다. 사전 등록 규칙("AFTER_GENERATION 과 AT_RESPONSE 의 위반율 차이가
    # 1%p 미만이면 둘은 같다고 보고 싼 쪽을 기본으로")이 발동했다 — 실측: 둘 다 위반율 0.00%였고
    # AT_RESPONSE 는 읽기를 한 번 더 쓴다(확인 2회 vs 1회). 판단과 못 잰 것은 ADR-038.
    #   AFTER_GENERATION    — 모델 반환 **뒤에** 출력만 읽어 거른다. 좁고 최신이다(기본)
    #   NONE                — 확인하지 않는다. 위반이 그대로 나간다(기준선 — 실측 0.96~7.11%)
    #   AT_GENERATION_START — 모델 호출 **전에** 넓게(풀 전체) 읽어 그 스냅샷으로 거른다.
    #                         읽기 1회지만 스냅샷이 **모델 지연만큼(실측 54ms)** 낡는다
    #   AT_RESPONSE         — 응답 직전에 한 번 더 확인한다. 비용은 늘고 잡는 것은 그 사이뿐이다
    constraint-policy: ${APP_RECOMMENDATION_CONSTRAINT_POLICY:AFTER_GENERATION}
    experiment:
      # E4 실험 계기(가용성 소진 엔드포인트)를 켠다. **기본 off** — 켜져 있으면 요청으로
      # 상품 가용성이 바뀌므로 실험 밖에서는 열지 않는다(빈이 아예 안 만들어져 경로가 404다).
      enabled: ${APP_RECOMMENDATION_EXPERIMENT_ENABLED:false}
  # A/B 실험(#256). 배정은 SHA-256(솔트:사용자 id) 로 고정한다(저장하지 않는다). 새 실험은 새 솔트로 시작한다.
  #   rec-history: 실험군 = 구매 이력 + 재구매 우선(ADR-060), 대조군 = 위 recommendation 설정 그대로
  experiments:
    rec-history:
      enabled: ${APP_EXPERIMENT_REC_HISTORY_ENABLED:false}
      salt: ${APP_EXPERIMENT_REC_HISTORY_SALT:rec-history-1}
      treatment-percent: ${APP_EXPERIMENT_REC_HISTORY_TREATMENT_PERCENT:50}
  # 에스크로(자금 보류) — 결제금을 구매확정 전까지 HELD로 잡아둔다.
  escrow:
    # 자동 구매확정까지의 보류 기간(일). 이 기간 무응답이면 자동 릴리스 대상이 된다.
    hold-period-days: ${APP_ESCROW_HOLD_DAYS:7}
    # 자동 릴리스 스케줄러 — 기본 off(테스트/부트 부작용 방지). 운영에서 env로 켠다.
    auto-release:
      enabled: ${APP_ESCROW_AUTO_RELEASE_ENABLED:false}
      interval-ms: 60000

# 웹훅 서명 검증(HMAC-SHA256) 시크릿. 아래는 로컬 개발 전용 기본값(16바이트 이상)이고, 운영은
# 반드시 env/시크릿 매니저로 오버라이드한다. 미설정/약한 키면 기동을 실패시킨다(WebhookSignatureVerifier fail-fast).
payment:
  webhook:
    secret: ${PAYMENT_WEBHOOK_SECRET:local-webhook-secret-please-override-32b}
    # 토스 웹훅 발신 IP 허용 목록(쉼표 구분). 비우면 검사하지 않는다 — 다른 기능과 같은 규약으로
    # 기본 off 다. 앱이 프록시·터널 뒤에 있으면 보이는 IP가 토스가 아니라 그 프록시라서, 켜면
    # 정상 웹훅까지 막힌다. <b>앞단이 있으면 이 검사는 앱이 아니라 그 앞단이 해야 한다.</b>
    # 토스가 공개한 발신 IP(2026-09 기준):
    #   13.124.18.147,13.124.108.35,3.36.173.151,3.38.81.32,
    #   115.92.221.121,115.92.221.122,115.92.221.123,
    #   115.92.221.125,115.92.221.126,115.92.221.127
    toss-allowed-ips: ${PAYMENT_WEBHOOK_TOSS_ALLOWED_IPS:}

  pg:
    # <b>PG 동시 호출 상한.</b> 워커를 몇 개까지 PG 에 내줄 것인가.
    #
    # 40 을 고른 계산(ADR-022):
    #   하한 — 정상 구간에서 절대 물지 않아야 한다. 가정한 피크 도착률 30/s 에 정상 p99 1초면
    #          동시 점유는 30 이다. 40 이면 물지 않는다(지연 0·30/s·상한 40 에서 거절 0건 확인).
    #   상한 — 브라운아웃에서 워커를 남겨야 한다. 워커 100 중 40 까지만 내주면 60 이 남는다.
    #          상한 없이 두면 PG 지연 3초·도착률 50/s 에서 무관한 조회 p95 가 8ms → 7.31초가 됐다.
    #
    # <b>이 값은 PG 응답시간의 함수다.</b> PG 를 바꾸거나 p99 가 달라지면 위 계산을 다시 한다.
    # 0 이하면 상한 없음(이전 동작).
    max-concurrent-calls: ${PAYMENT_PG_MAX_CONCURRENT_CALLS:40}

  # PG HTTP 타임아웃. 코드(@Value)에도 같은 기본값이 있지만, 이 값은 장애 대응에서 조정 대상이라
  # 밖으로 꺼내 둔다.
  #
  # read-timeout 이 커넥션이 아니라 <톰캣 워커 스레드> 점유의 상한이다. 체크아웃이 사가라
  # DB 커넥션은 PG 응답과 무관해졌지만(ADR-007), 워커는 여전히 여기까지 묶인다.
  # 줄이면 장애가 빨리 끝나는 대신 끊긴 호출이 전부 UNKNOWN 이 되어 복구 배치 일거리가 는다.
  # 어느 쪽이 싼지는 아직 안 쟀다(ADR-022).
  toss:
    connect-timeout: ${PAYMENT_TOSS_CONNECT_TIMEOUT:2s}
    read-timeout: ${PAYMENT_TOSS_READ_TIMEOUT:5s}
  kakaopay:
    connect-timeout: ${PAYMENT_KAKAOPAY_CONNECT_TIMEOUT:2s}
    read-timeout: ${PAYMENT_KAKAOPAY_READ_TIMEOUT:5s}

---
# kafka 프로파일: 브로커가 있을 때만 활성화한다(예: SPRING_PROFILES_ACTIVE=kafka).
# 외부화를 켜고, 유실 방지(acks=all)·중복 억제(멱등 producer)를 갖춘 producer를 구성한다.
# 이 문서를 활성화하지 않으면(기본) 위의 externalization.enabled=false가 유지되어 브로커 없이도 뜬다.
spring:
  config:
    activate:
      on-profile: kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Modulith 외부화는 이벤트를 이미 JSON byte[]로 직렬화해 넘긴다. JsonSerializer를 쓰면
      # 그 byte[]가 다시 JSON(base64 문자열)으로 감싸져 이중 인코딩된다(소비자 실검증에서 발견).
      # ByteArraySerializer로 그대로 실어야 와이어에 깨끗한 JSON이 나간다.
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all                    # 유실 방지 — 모든 in-sync 복제본이 받아야 성공
      properties:
        enable.idempotence: true   # 멱등 producer — 재시도로 인한 중복 발행 억제
    # 개인화 컨텍스트 컨슈머(M2). 이 앱의 첫 인앱 컨슈머다 — 그 판단은 ADR-034.
    # 값은 String으로 받아 이 앱의 ObjectMapper로 UserActivityEvent에 직접 바인딩한다.
    # JsonDeserializer를 쓰면 타입 헤더(__TypeId__)의 클래스명에 결합된다(consumer-app과 같은 이유).
    consumer:
      auto-offset-reset: earliest   # 소비자가 늦게 떠도 기존 이벤트부터 따라잡는다
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  modulith:
    events:
      externalization:
        enabled: true              # @Externalized 이벤트를 Kafka로 발행(Outbox가 유실 방지, at-least-once)

  # 제재 스크리닝. 기본 꺼짐 — 켜면 외부 명단을 받아 온다.
  #
  # UN 통합 명단만 쓴다. 공개 제재 목록 중 <기계가 읽히고 라이선스 제약이 없으면서>
  # 생년월일·국적까지 주는 것이 UN 과 OFAC 둘인데, 한국은 UN 안보리 결의 지정자를
  # 자동 반영하므로 국내 서비스에도 그대로 의미가 있다.
  # 국내 금융위 고시는 기계가 읽을 수 있는 공개 배포를 못 찾아 안 쓴다.
  #
  # PEP(주요직위자)는 넣지 않았다. 정부가 배포하는 공식 명단이 없고, 공개 데이터는
  # 상업 이용에 별도 라이선스가 필요하다. 포트로만 열어 두고 비워 뒀다.
  screening:
    # 몇 점부터 사람에게 보내나. 낮추면 오탐이, 올리면 미탐이 는다.
    potential-threshold: ${APP_SCREENING_THRESHOLD:80}
    list:
      un:
        enabled: ${APP_SCREENING_UN_ENABLED:false}
        url: ${APP_SCREENING_UN_URL:https://scsanctions.un.org/resources/xml/en/consolidated.xml}
        # 하루 한 번. OFAC 은 갱신 주기를 정해 두지 않아 <갱신될 때마다 즉시>가 이상적이지만
        # 매일 한 번이 업계에서 모범관행으로 다뤄지는 하한선이다.
        cron: ${APP_SCREENING_UN_CRON:0 0 5 * * *}
        timeout-seconds: 30
    # 명단 갱신을 따라 기존 판매자를 다시 훑는다.
    # 온보딩 때 한 번 보고 마는 것은 안 보는 것과 크게 다르지 않다 — 어제 통과한 판매자가
    # 오늘 지정될 수 있다.
    rescreen:
      enabled: ${APP_SCREENING_RESCREEN_ENABLED:false}
      cron: ${APP_SCREENING_RESCREEN_CRON:0 30 5 * * *}

# 이상거래 탐지 모델. <b>지금은 섀도만 돈다.</b> 점수를 내고 기록만 하고 아무것도 안 막는다.
#
# 켤 조건 넷 중 셋이 아직 안 넘었다(docs/27 5-2절).
#   A 실 기저율 환산 정밀도 20% 이상 — 지금 1% 기저율에서 20.6% 로 겨우 걸친다
#   B 축 여섯 중 넷이 50% 이상   — 지금 셋이다(IP 회전 0%, 심야 21%)
#   C 섀도 모드 선행            — <b>이 설정이 그것이다</b>
#   D 상시 홀드아웃 유지         — holdout.percent 가 그것이다
fds:
  model:
    # 학습 결과 그대로다. FraudModelEvalTest 가 찍어 준 값을 옮겼고 순서는
    # SequenceFeatures.NAMES 와 같다. 순서가 어긋나면 조용히 틀린 점수가 나온다.
    #   windowCount, amountToMedian, nearThresholdRatio, microCount,
    #   escalation, deviceChurn, ipChurn, nightRatio
    weights: ${FDS_MODEL_WEIGHTS:2.259489,0.383182,2.921201,7.864491,2.225669,2.693387,-1.296761,3.102604}
    bias: ${FDS_MODEL_BIAS:-4.714702}
    # 학습 절반에서 정상 오탐이 5% 가 되는 임계다. 가중치가 바뀌면 이 값도 같이 바뀐다.
    threshold: ${FDS_MODEL_THRESHOLD:0.539601}
    shadow:
      # 점수를 내고 기록만 한다. 꺼도 결제와 사후 탐지는 그대로 돈다.
      enabled: ${FDS_MODEL_SHADOW_ENABLED:true}
    window:
      # 창을 얼마나 되돌아볼지. 길게 잡으면 amountToMedian 이 <요즘> 씀씀이가 아니라
      # 평생 평균과 견주는 값이 된다.
      hours: ${FDS_MODEL_WINDOW_HOURS:24}
      # 창 조회 상한. 상황 2.3 에서 배치 조회 15곳에 건 것과 같은 이유다.
      max-rows: ${FDS_MODEL_WINDOW_MAX_ROWS:200}
    holdout:
      # 이 비율만큼은 점수를 아예 안 낸다. <b>켜기 전에 있어야 한다.</b> 켠 다음에 만들면
      # 이미 비교할 이전이 없다. 주문번호 해시로 갈라 같은 주문은 늘 같은 쪽에 든다.
      percent: ${FDS_MODEL_HOLDOUT_PERCENT:5}

---
# worker 프로파일: <b>같은 jar를 배치 실행 주체로 배포한다</b>(SPRING_PROFILES_ACTIVE=worker).
#
# API 배포는 이 프로파일 없이 뜨므로 모든 스케줄러가 기본 off다. 즉 프로파일 하나로 배포 단위를
# 둘로 나눈다 — 결제 API는 스케줄러를 들고 있지 않아 자유롭게 수평 확장·롤링하고, 배치는
# 단일 실행 주체로 남는다. 저장소·브로커를 나누지 않으므로 트랜잭션과 조인은 그대로다.
#
# 왜 이 형태를 먼저 재는가(ADR-029): 모놀리스 실측(docs/performance/msa-baseline-experiments.md)이
# 재현한 두 결합 — (실험 2) 확장하면 정산 스케줄러가 중복 실행된다, (실험 3) 무관 모듈 배포에도
# 전체 재시작으로 결제가 중단된다 — 은 <b>배포 단위만 나눠도 풀린다.</b> 서비스·저장소까지 나눈 것은
# 그 위에 얹는 <별도의 선택>이고, 이 프로파일이 그 기준선을 만든다.
#
# 제재 명단(UN)·재스크리닝은 여기서 켜지 않는다 — 외부 네트워크를 타는 별개 관심사이고,
# 배치 실행 주체를 나누는 이 실험의 변수가 아니다.
spring:
  config:
    activate:
      on-profile: worker

app:
  settlement:
    enabled: true
  recovery:
    enabled: true
  checkout:
    recovery:
      enabled: true
  va:
    expiry:
      enabled: true
  dunning:
    enabled: true
  order:
    expiry:
      enabled: true
  compensation:
    enabled: true
  escrow:
    auto-release:
      enabled: true
  outbox:
    cleanup:
      enabled: true
  idempotency:
    cleanup:
      enabled: true
  webhook:
    pending-retry:
      enabled: true
