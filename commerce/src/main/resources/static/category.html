<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BE-commerce · 카테고리</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/store.css">
</head>
<body>
<header id="app-header"></header>

<main class="page">
  <div class="container">
    <nav class="crumb" id="crumb"></nav>
    <div class="page-head" id="head"></div>

    <div class="catalog">
      <aside class="side">
        <h4>CATEGORIES</h4>
        <div id="side-list"></div>

        <h4 style="margin-top:22px">FILTERS</h4>
        <div id="filters">
          <div class="facet">
            <div class="facet-title">색상</div>
            <div class="facet-list" id="f-colour">불러오는 중…</div>
          </div>
          <div class="facet">
            <div class="facet-title">상품 종류</div>
            <select class="input" id="f-type"></select>
          </div>
          <div class="facet">
            <div class="facet-title">가격 (원)</div>
            <div class="price-range">
              <input class="input" id="f-min" type="number" min="0" step="1000" placeholder="최소">
              <span class="tilde">~</span>
              <input class="input" id="f-max" type="number" min="0" step="1000" placeholder="최대">
            </div>
            <button class="btn btn-sm btn-block" id="f-apply" style="margin-top:8px">적용</button>
          </div>
          <a class="facet-reset" id="f-reset" href="#">필터 초기화</a>
        </div>
      </aside>

      <section>
        <div class="toolbar">
          <div class="count" id="count">불러오는 중…</div>
          <label class="muted" style="font-size:13px">정렬
            <select class="input" id="sort" style="width:auto;display:inline-block;margin-left:8px">
              <option value="newest">신상품순</option>
              <option value="price_asc">낮은 가격순</option>
              <option value="price_desc">높은 가격순</option>
              <option value="name">이름순</option>
            </select>
          </label>
        </div>
        <div class="grid grid-3" id="grid"></div>
        <div class="pager" id="pager"></div>
      </section>
    </div>
  </div>
</main>

<footer id="app-footer"></footer>

<script src="assets/store.js"></script>
<script>
  var SIZE = 12;
  var code = Store.qs('code') || '';
  var sort = Store.qs('sort') || 'newest';
  var page = Math.max(0, Number(Store.qs('page') || 0));
  // 필터는 전부 URL에 있다 — 공유·뒤로가기가 그대로 동작하고, 새로고침에서도 살아남는다.
  var colour = Store.qs('colour') || '';
  var productType = Store.qs('productType') || '';
  var minPrice = Store.qs('minPrice') || '';
  var maxPrice = Store.qs('maxPrice') || '';

  Store.renderHeader(code);
  Store.renderFooter();
  document.getElementById('sort').value = sort;

  function go(params) {
    var u = new URL(location.href);
    Object.keys(params).forEach(function (k) {
      if (params[k] == null || params[k] === '') u.searchParams.delete(k);
      else u.searchParams.set(k, params[k]);
    });
    location.href = u.pathname + '?' + u.searchParams.toString();
  }

  document.getElementById('sort').addEventListener('change', function () {
    go({ sort: this.value, page: '' });
  });

  function pagerHtml(p, total) {
    if (total <= 1) return '';
    var out = '<button ' + (p <= 0 ? 'disabled' : '') + ' data-p="' + (p - 1) + '">←</button>';
    for (var i = 0; i < total; i++) {
      if (total > 7 && i > 1 && i < total - 2 && Math.abs(i - p) > 1) {
        if (i === 2 || i === total - 3) out += '<span style="align-self:center;color:var(--sub)">…</span>';
        continue;
      }
      out += '<button class="' + (i === p ? 'on' : '') + '" data-p="' + i + '">' + (i + 1) + '</button>';
    }
    out += '<button ' + (p >= total - 1 ? 'disabled' : '') + ' data-p="' + (p + 1) + '">→</button>';
    return out;
  }

  document.getElementById('pager').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b && b.dataset.p != null && !b.disabled) go({ page: b.dataset.p === '0' ? '' : b.dataset.p });
  });

  // --- 필터 패널: 모든 선택을 URL로 보내 go()가 상태를 하나로 유지하게 한다 ---
  document.getElementById('f-colour').addEventListener('change', function (e) {
    var el = e.target;
    if (!el || el.type !== 'checkbox') return;
    go({ colour: el.checked ? el.dataset.colour : '', page: '' });
  });
  document.getElementById('f-type').addEventListener('change', function () {
    go({ productType: this.value, page: '' });
  });
  document.getElementById('f-min').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') applyPrice();
  });
  document.getElementById('f-max').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') applyPrice();
  });
  document.getElementById('f-apply').addEventListener('click', applyPrice);
  function applyPrice() {
    go({ minPrice: document.getElementById('f-min').value.trim(),
         maxPrice: document.getElementById('f-max').value.trim(), page: '' });
  }
  document.getElementById('f-reset').addEventListener('click', function (e) {
    e.preventDefault();
    go({ colour: '', productType: '', minPrice: '', maxPrice: '', page: '' });
  });

  // 현재 화면의 필터를 패싯 API에 그대로 넘긴다. 각 패싯은 자기 축을 스스로 빼고 세므로
  // 여기서는 필터를 골라 뺄 필요가 없다(색상 개수는 색상 선택과 무관하게 나온다).
  function currentFilters() {
    return { category: code, colour: colour, productType: productType,
             minPrice: minPrice, maxPrice: maxPrice };
  }

  function renderFacets(f) {
    var colours = (f && f.colours) || [];
    var types = (f && f.productTypes) || [];

    document.getElementById('f-colour').innerHTML = colours.length
      ? colours.map(function (c) {
          return '<label class="facet-row"><input type="checkbox" data-colour="' + Store.esc(c.code) + '"' +
            (c.code === colour ? ' checked' : '') + '><span class="facet-name">' + Store.esc(c.name) +
            '</span><span class="facet-cnt">' + Number(c.count).toLocaleString() + '</span></label>';
        }).join('')
      : '<div class="muted" style="font-size:13px">해당 색상 없음</div>';

    document.getElementById('f-type').innerHTML =
      '<option value="">전체 종류</option>' + types.map(function (t) {
        return '<option value="' + Store.esc(t.code) + '"' + (t.code === productType ? ' selected' : '') +
          '>' + Store.esc(t.name) + ' (' + Number(t.count).toLocaleString() + ')</option>';
      }).join('');
  }

  (async function () {
    var tree = await Store.categoryTree();
    var byCode = {};
    tree.forEach(function (c) { byCode[c.code] = c; });
    var parents = tree.filter(function (c) { return !c.parentCode; });

    var current = byCode[code];
    // 중분류를 보고 있으면 그 부모를 활성으로 편다 — 사이드바가 어디인지 알려줘야 한다.
    var activeParent = current ? (current.parentCode || current.code) : '';

    var side = '<a href="search.html"' + (code ? '' : ' class="on"') + '>전체 상품</a>';
    parents.forEach(function (p) {
      side += '<a href="category.html?code=' + encodeURIComponent(p.code) + '"' +
        (p.code === activeParent ? ' class="on"' : '') + '>' + Store.esc(p.name) +
        '<span class="cnt">' + p.productCount + '</span></a>';
      if (p.code !== activeParent) return;
      var kids = tree.filter(function (c) { return c.parentCode === p.code; });
      if (!kids.length) return;
      side += '<div class="sub">' + kids.map(function (k) {
        return '<a href="category.html?code=' + encodeURIComponent(k.code) + '"' +
          (k.code === code ? ' class="on"' : '') + '>' + Store.esc(k.name) +
          '<span class="cnt">' + k.productCount + '</span></a>';
      }).join('') + '</div>';
    });
    document.getElementById('side-list').innerHTML = side;

    var crumb = '<a href="index.html">홈</a><span class="sep">/</span>';
    if (!code) {
      crumb += '<span>카테고리</span>';
    } else if (current && current.parentCode) {
      crumb += '<a href="category.html?code=' + encodeURIComponent(current.parentCode) + '">' +
        Store.esc(byCode[current.parentCode].name) + '</a><span class="sep">/</span><span>' +
        Store.esc(current.name) + '</span>';
    } else {
      crumb += '<a href="category.html">카테고리</a><span class="sep">/</span><span>' +
        Store.esc(current ? current.name : code) + '</span>';
    }
    document.getElementById('crumb').innerHTML = crumb;

    var head = code && current
      ? '<h1>' + Store.esc(current.name) + '</h1><p>' + Store.esc(current.description || '') + '</p>'
      : '<h1>전체 상품</h1><p>카탈로그의 모든 상품</p>';

    // 대분류 안의 중분류 칩 — 목록을 보면서 바로 좁힐 수 있게 한다.
    var siblings = activeParent ? tree.filter(function (c) { return c.parentCode === activeParent; }) : [];
    if (siblings.length) {
      head += '<div class="chips" style="margin-top:16px">' +
        '<a class="chip' + (current && !current.parentCode ? ' on' : '') +
          '" href="category.html?code=' + encodeURIComponent(activeParent) + '">전체' +
          '<span class="cnt">' + byCode[activeParent].productCount + '</span></a>' +
        siblings.map(function (k) {
          return '<a class="chip' + (k.code === code ? ' on' : '') + '" href="category.html?code=' +
            encodeURIComponent(k.code) + '">' + Store.esc(k.name) +
            '<span class="cnt">' + k.productCount + '</span></a>';
        }).join('') + '</div>';
    }
    document.getElementById('head').innerHTML = head;

    document.getElementById('grid').innerHTML = Store.skeletonGrid(SIZE);

    // 필터 패널 — 가격 입력의 초기값을 URL에서 채우고, 색상·종류 패싯을 받아 그린다.
    document.getElementById('f-min').value = minPrice;
    document.getElementById('f-max').value = maxPrice;
    Store.facets(currentFilters()).then(renderFacets);

    var query = '/products?category=' + encodeURIComponent(code) +
      '&sort=' + encodeURIComponent(sort) + '&page=' + page + '&size=' + SIZE +
      (colour ? '&colour=' + encodeURIComponent(colour) : '') +
      (productType ? '&productType=' + encodeURIComponent(productType) : '') +
      (minPrice ? '&minPrice=' + encodeURIComponent(minPrice) : '') +
      (maxPrice ? '&maxPrice=' + encodeURIComponent(maxPrice) : '');
    var r = await Store.api('GET', query, { noAuth: true });

    if (!r.ok) {
      document.getElementById('count').textContent = '';
      document.getElementById('grid').innerHTML = '<div class="empty"><h3>상품을 불러오지 못했습니다</h3></div>';
      return;
    }

    var d = r.data;
    document.getElementById('count').innerHTML =
      '전체 <b>' + d.totalElements.toLocaleString() + '</b>개 · ' + (page + 1) + '/' + Math.max(1, d.totalPages) + ' 페이지';
    document.getElementById('grid').innerHTML = d.items.length
      ? d.items.map(Store.productCard).join('')
      : '<div class="empty" style="grid-column:1/-1"><h3>이 카테고리에 상품이 없습니다</h3>' +
        '<p>다른 카테고리를 둘러보세요.</p><a class="btn btn-primary" href="category.html">전체 상품 보기</a></div>';
    document.getElementById('pager').innerHTML = pagerHtml(page, d.totalPages);
  })();
</script>
</body>
</html>
