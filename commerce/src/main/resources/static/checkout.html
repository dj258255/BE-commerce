<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BE-commerce · 주문/결제</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/store.css">
</head>
<body>
<header id="app-header"></header>

<main class="page">
  <div class="container">
    <nav class="crumb"><a href="index.html">홈</a><span class="sep">/</span><a href="cart.html">장바구니</a><span class="sep">/</span><span>주문/결제</span></nav>
    <div class="page-head"><h1>주문/결제</h1><p>실제 주문·승인 API로 결제합니다. 카드·포인트·월렛을 섞어 결제할 수 있습니다.</p></div>
    <div id="body"></div>
  </div>
</main>

<footer id="app-footer"></footer>

<script src="assets/store.js"></script>
<script>
  Store.renderHeader();
  Store.renderFooter();

  // 결제·주문은 로그인 필요 — 로그인 후 이 화면으로 돌아온다.
  var loggedIn = Store.auth.require();

  var state = { orderNo: null, totalAmount: 0, point: 0, wallet: 0, balances: { point: 0, wallet: 0 } };
  var items = Store.cart.all();

  function renderEmpty() {
    document.getElementById('body').innerHTML =
      '<div class="empty"><h3>결제할 상품이 없습니다</h3><p>장바구니에 상품을 담아주세요.</p>' +
      '<a class="btn btn-primary" href="category.html">상품 둘러보기</a></div>';
  }

  function render() {
    var subtotal = items.reduce(function (n, i) { return n + i.price * i.quantity; }, 0);
    state.totalAmount = state.totalAmount || subtotal;

    document.getElementById('body').innerHTML =
      '<div class="checkout-grid">' +
        '<div>' +
          '<section class="panel">' +
            '<h3>배송지</h3><p class="hint">데모 화면입니다. 실제 배송 도메인은 이 범위 밖입니다.</p>' +
            '<label class="field"><span>받는 사람</span><input class="input" value="홍길동"></label>' +
            '<label class="field"><span>휴대폰</span><input class="input" value="010-0000-0000"></label>' +
            '<label class="field"><span>주소</span><input class="input" value="서울시 강남구 테헤란로 000"></label>' +
          '</section>' +

          '<section class="panel">' +
            '<h3>결제 수단</h3>' +
            '<p class="hint">포인트·월렛을 입력하면 나머지를 카드로 결제합니다. 합계는 서버가 확정한 주문 금액과 일치해야 합니다.</p>' +
            '<div class="mix-row"><span>포인트 <span class="badge b-dim" id="pbal">—</span></span>' +
              '<input class="input" id="point" type="number" min="0" step="1" value="0"></div>' +
            '<div class="mix-row"><span>선불 월렛 <span class="badge b-dim" id="wbal">—</span></span>' +
              '<input class="input" id="wallet" type="number" min="0" step="1" value="0"></div>' +
            '<div class="mix-row"><span>카드 결제</span><b class="mono" id="card-amt">—</b></div>' +
            '<div id="mix-notice"></div>' +
          '</section>' +
        '</div>' +

        '<aside class="summary">' +
          '<h3>주문 요약</h3>' +
          items.map(function (i) {
            return '<div class="sum-row"><span>' + Store.esc(i.name) + ' × ' + i.quantity + '</span><b>' +
              Store.won(i.price * i.quantity) + '</b></div>';
          }).join('') +
          '<div class="sum-row"><span>배송비</span><b>무료</b></div>' +
          '<div class="sum-total"><span>결제 금액</span><span class="price">' + Store.won(subtotal) + '</span></div>' +
          '<button class="btn btn-primary btn-block btn-lg" id="payment-btn" style="margin-top:18px">결제하기</button>' +
          '<div id="payment-notice"></div>' +
        '</aside>' +
      '</div>';

    document.getElementById('payment-btn').onclick = submitPayment;
    ['point', 'wallet'].forEach(function (k) {
      document.getElementById(k).addEventListener('input', syncMix);
    });
    loadBalances();
    syncMix();
  }

  function loadBalances() {
    Store.api('GET', '/points').then(function (r) {
      if (r.ok && r.data) {
        state.balances.point = Number(r.data.balance) || 0;
        document.getElementById('pbal').textContent = Store.won(state.balances.point) + ' 보유';
      }
    });
    Store.api('GET', '/wallet').then(function (r) {
      if (r.ok && r.data) {
        state.balances.wallet = Number(r.data.balance) || 0;
        document.getElementById('wbal').textContent = Store.won(state.balances.wallet) + ' 보유';
      }
    });
  }

  /** 포인트·월렛 입력을 잔액·주문금액 안으로 클램프하고 카드 몫을 계산한다. */
  function syncMix() {
    var total = state.totalAmount;
    state.point = Math.min(Math.max(0, Number(document.getElementById('point').value) || 0),
      state.balances.point, total);
    state.wallet = Math.min(Math.max(0, Number(document.getElementById('wallet').value) || 0),
      state.balances.wallet, total - state.point);
    document.getElementById('point').value = state.point;
    document.getElementById('wallet').value = state.wallet;
    var card = total - state.point - state.wallet;
    document.getElementById('card-amt').textContent = Store.won(card);
    document.getElementById('mix-notice').innerHTML =
      (state.point + state.wallet > 0)
        ? '<div class="notice ok">카드 ' + Store.won(card) + ' + 포인트 ' + Store.won(state.point) +
          ' + 월렛 ' + Store.won(state.wallet) + ' = ' + Store.won(total) + '</div>'
        : '';
  }

  function paymentNotice(html) { document.getElementById('payment-notice').innerHTML = html; }
  function setBusy(busy) {
    var b = document.getElementById('payment-btn');
    if (!b) return;
    b.disabled = busy;
    b.innerHTML = busy ? '<span class="spinner"></span> 처리 중…' : '결제하기';
  }

  // 결제 확정 응답은 15초만 붙잡고 기다리고, 그 뒤에는 "확인 중"을 띄우고 주문 조회로 결과를 기다린다.
  // 조회 창은 서버가 결과를 낼 수 있는 가장 긴 시간(PG 읽기 타임아웃 60초 + 여유 5초)까지 덮는다.
  // 앞단은 뒷단의 최대 처리 시간 이상 기다려야 "승인됐는데 화면은 실패"가 생기지 않는다(ADR-022 2026-09-30).
  var CONFIRM_TIMEOUT_MS = 15000;
  var POLL_INTERVAL_MS = 2000, POLL_TRIES = 25;
  // 서버에 보내는 남은 시간(ADR-022 데드라인). 응답을 멈춘 뒤에도 조회로 결과를 계속 기다리므로
  // 응답 대기와 조회 창을 더한 값이다(65초). 응답 대기만 보내면 아직 조회로 기다리는 고객의 결제를 서버가 뺄 수 있다.
  var CONFIRM_DEADLINE_MS = CONFIRM_TIMEOUT_MS + POLL_INTERVAL_MS * POLL_TRIES;

  /** 승인 미확정(202 UNKNOWN)은 주문 조회로 확정을 폴링한다 — 스펙이 명시한 계약. */
  async function pollUntilDecided(orderNo, tries) {
    for (var i = 0; i < tries; i++) {
      await new Promise(function (r) { setTimeout(r, POLL_INTERVAL_MS); });
      var r = await Store.api('GET', '/orders/' + orderNo);
      if (r.ok) {
        var ps = r.data.paymentStatus;
        if (ps === 'DONE' || ps === 'ABORTED' || ps === 'CANCELED' || ps === 'PARTIAL_CANCELED') return r.data;
      }
    }
    return null;
  }

  async function submitPayment() {
    if (!loggedIn) { location.href = 'login.html?next=checkout.html'; return; }
    setBusy(true);
    paymentNotice('');

    try {
      // 1) 주문 생성(최초 1회). 금액은 서버가 확정한다.
      if (!state.orderNo) {
        var order = await Store.api('POST', '/orders', { body: { items: Store.cart.toOrderLines() } });
        if (!order.ok) {
          setBusy(false);
          paymentNotice('<div class="notice err">주문을 만들지 못했습니다. (' + order.status + ')</div>');
          return;
        }
        state.orderNo = order.data.orderNo;
        state.totalAmount = order.data.totalAmount;
      }

      var total = state.totalAmount;
      var point = Math.min(state.point, total);
      var wallet = Math.min(state.wallet, total - point);
      var card = total - point - wallet;

      // 2) 승인 — 멱등키는 시도마다 새로 만든다(같은 키로 다른 본문을 보내면 422).
      var res = await Store.api('POST', '/payments/confirm', {
        body: {
          paymentKey: 'pk-' + Store.uuid(),
          orderNo: state.orderNo,
          amount: card,
          pointAmount: point,
          walletAmount: wallet,
          installmentMonths: 0
        },
        timeoutMs: CONFIRM_TIMEOUT_MS,
        deadlineMs: CONFIRM_DEADLINE_MS
      });

      if (res.ok) {
        Store.cart.clear();
        paymentNotice('<div class="notice ok">결제가 완료되었습니다. 주문내역으로 이동합니다…</div>');
        setTimeout(function () { location.href = 'orders.html'; }, 900);
        return;
      }

      // 기다림을 멈춘 경우도 202 와 같이 다룬다. 서버는 계속 처리 중일 수 있어 실패로 단정하면
      // 고객이 다시 눌러 이중 결제를 시도하게 된다. 주문 상태로 결과를 확인한다.
      if (res.status === 202 || res.timedOut) {
        paymentNotice(res.timedOut
          ? '<div class="notice">응답이 늦어 결제 결과를 확인하고 있습니다…</div>'
          : '<div class="notice">결제 결과를 확인하고 있습니다…</div>');
        var decided = await pollUntilDecided(state.orderNo, POLL_TRIES);
        if (decided && decided.paymentStatus === 'DONE') {
          Store.cart.clear();
          paymentNotice('<div class="notice ok">결제가 확정되었습니다. 주문내역으로 이동합니다…</div>');
          setTimeout(function () { location.href = 'orders.html'; }, 900);
          return;
        }
        setBusy(false);
        if (decided && decided.paymentStatus === 'ABORTED') {
          paymentNotice('<div class="notice err">결제가 진행되지 않았습니다. 다시 시도해 주세요.</div>');
          return;
        }
        paymentNotice('<div class="notice err">아직 결과가 확정되지 않았습니다. 잠시 후 주문내역에서 확인해 주세요.</div>');
        return;
      }

      setBusy(false);
      var msg = (res.data && res.data.message) ? res.data.message : ('결제가 거절되었습니다. (' + res.status + ')');
      paymentNotice('<div class="notice err">' + Store.esc(msg) + '</div>');
    } catch (e) {
      setBusy(false);
      paymentNotice('<div class="notice err">처리 중 오류가 발생했습니다.</div>');
    }
  }

  if (items.length) render(); else renderEmpty();
</script>
</body>
</html>
