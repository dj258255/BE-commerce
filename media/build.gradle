plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7'
}

// commerce 애플리케이션에 같은 jar로 포함되는 라이브러리 모듈이다(R32, ADR-080) —
// 자체 bootJar·main 클래스가 없다. commerce가 이 프로젝트에 의존하고(implementation
// project(':media')), media는 commerce에 의존하지 않는다 — 순환을 막는 방향이다.
// group·version은 commerce와 맞춰 둔다(게시하진 않지만 혼란을 줄인다).
group = 'com.beomsu'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    // 파라미터 이름 보존 — commerce/build.gradle과 같은 이유(Jackson record 역직렬화)
    options.compilerArgs << '-parameters'
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        // commerce가 실제로 구동할 버전과 맞춘다 — 같은 jar 안에서 spring-web 등의 버전이
        // 둘로 갈리면 classpath 충돌이 조용히 일어난다. 버전 숫자는 commerce/build.gradle을
        // 그대로 따라간다(올릴 때 두 곳을 함께 본다).
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.2"
        mavenBom "org.springframework.modulith:spring-modulith-bom:1.3.12"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // ShortsFeedController가 @AuthenticationPrincipal Jwt로 "로그인이면 principal, 아니면
    // 익명"을 가린다(R27) — commerce가 이미 쓰는 것과 같은 Resource Server 타입만 필요하고,
    // 보안 설정(SecurityFilterChain) 자체는 commerce가 앱 전체에 한 번만 구성한다.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // 고정 이벤트를 시청자에게 보내는 WebSocket(R9) — LivePinWebSocketHandler·
    // LivePinWebSocketConfig.
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // 방송 특가 한정 수량의 Redis 선점(TTL) 게이트(R12, LiveOrderGate) — commerce의 재고
    // Redis(StringRedisTemplate)와 같은 커넥션 풀·설정을 쓴다(spring.data.redis.*는 앱 전체에
    // 한 번만 구성된다). 이 모듈은 재고·결제 로직을 두지 않는다(R32) — 이건 그와 별개인
    // "방송-상품" 프로모션 한도 카운터일 뿐이다.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // LiveOrderGate 의 거절 카운터(Micrometer) — commerce 의 actuator starter 가 레지스트리
    // 빈을 제공하므로(앱 전체에 한 번만), 여기서는 API만 필요하다.
    implementation 'io.micrometer:micrometer-core'
    // package-info.java의 @ApplicationModule 애너테이션 — 모듈 경계 검증은 commerce 쪽
    // ModularityTests가 (이 프로젝트의 클래스가 올라간) 합쳐진 classpath를 스캔해서 한다.
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    // @ApplicationModuleListener(R23 변환 리스너) — Event Publication Registry(Outbox)의
    // JPA 영속화 자체는 commerce의 spring-modulith-starter-jpa가 앱 전체에 한 번만 설정한다.
    implementation 'org.springframework.modulith:spring-modulith-events-api'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 이 모듈의 테스트는 DB·전체 애플리케이션을 띄우지 않는다. 대부분은 순수 단위 테스트이고,
    // 일부(ShortsTranscodeListenerConditionalTest)는 ApplicationContextRunner로 @ConditionalOnProperty
    // 평가만 가벼운 컨텍스트로 본다 — 둘 다 DB가 없다. 전체 애플리케이션을 띄우는 통합 테스트
    // (ShortsApiIntegrationTest)는 commerce 쪽에 남아 있다(BeCommerceApplication·SharedContainers
    // 둘 다 commerce 소유라 media가 몰라야 한다, ADR-080).
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 트랜잭션 경계·동시성 테스트(R23) 전용 — 인메모리, Docker 불필요(commerce/build.gradle의
    // 같은 줄과 같은 이유). MySQL Flyway 마이그레이션은 H2에서 돌리지 않는다(ddl-auto=create-drop).
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
