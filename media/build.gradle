plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7'
}

// commerce 애플리케이션에 같은 jar로 포함되는 라이브러리 모듈이다(R32, ADR-080) —
// 자체 bootJar·main 클래스가 없다. commerce가 이 프로젝트에 의존하고(implementation
// project(':media')), media는 commerce에 의존하지 않는다 — 순환을 막는 방향이다.
// group·version은 commerce와 맞춰 둔다(게시하진 않지만 혼란을 줄인다).
group = 'com.beomsu'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    // 파라미터 이름 보존 — commerce/build.gradle과 같은 이유(Jackson record 역직렬화)
    options.compilerArgs << '-parameters'
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        // commerce가 실제로 구동할 버전과 맞춘다 — 같은 jar 안에서 spring-web 등의 버전이
        // 둘로 갈리면 classpath 충돌이 조용히 일어난다. 버전 숫자는 commerce/build.gradle을
        // 그대로 따라간다(올릴 때 두 곳을 함께 본다).
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.2"
        mavenBom "org.springframework.modulith:spring-modulith-bom:1.3.12"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // package-info.java의 @ApplicationModule 애너테이션 — 모듈 경계 검증은 commerce 쪽
    // ModularityTests가 (이 프로젝트의 클래스가 올라간) 합쳐진 classpath를 스캔해서 한다.
    implementation 'org.springframework.modulith:spring-modulith-starter-core'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 이 모듈의 테스트는 전부 순수 단위 테스트다(Spring 컨텍스트를 안 띄운다) — 전체
    // 애플리케이션을 띄우는 통합 테스트(ShortsApiIntegrationTest)는 commerce 쪽에 남아 있다
    // (BeCommerceApplication·SharedContainers 둘 다 commerce 소유라 media가 몰라야 한다, ADR-080).
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
