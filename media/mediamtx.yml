# MediaMTX 설정 — 라이브 방송 1단계(R1·R2·R3). 명세 5절의 출발점(RTMP 송출, HTTP 인증 훅,
# 시작·종료 훅)을 다룬다. HLS는 기본 재생목록이 뜨는지만 확인하고(아래 hls 절), 지연 튜닝·
# LL-HLS·녹화(R4)는 다음 단계에서 연다.
#
# 버전 주의: 이 파일은 이 저장소를 만들 때 알던 MediaMTX(구 rtsp-simple-server) 스키마
# 지식으로 썼다 — docker.io에서 이미지를 받아 안의 기본 설정과 맞대 보며 고치지 못했다
# (이 샌드박스에서 docker 명령 자체가 실행 정책에 막혀 있다, ADR-082 "다시 볼 조건").
#
# 실제로 고친 사례(R1~R3 실 송출 확인): mediamtx 컨테이너가 종료 코드 1로 즉시 꺼졌다. 이
# 샌드박스에서는 컨테이너 로그를 볼 도구가 없어(mediamtx가 studio.yaml의 관리 서비스가
# 아니라 service_logs·run_in_service 대상이 아니다) 메시지를 직접 보지 못했지만, runOnPublish·
# runOnPublishRestart·runOnUnpublish는 애초에 MediaMTX에 없는 훅 이름이다(그 이름은
# rtsp-simple-server 시절 기억으로 잘못 적은 것) — 실제 훅은 "경로가 준비됨/준비 안 됨"을
# 기준으로 하는 runOnReady·runOnReadyRestart·runOnNotReady다. 이렇게 고쳤다(아래 paths 참고).
# 여전히 안 뜨면(다른 "unknown field") 그 메시지로 나머지 키 이름도 고친다.
#
# ${LIVE_HOOKS_HOST}: commerce가 떠 있는 호스트 이름 — compose 파일마다 다르다(아래 주석).
# MediaMTX가 YAML 값에서 환경변수 치환을 지원한다는 전제다(확인하지 못함 — 치환이 안 되면
# 이 파일을 쓰는 쪽에서 직접 호스트명을 박아 넣어야 한다).
#   - 저장소 루트 compose.yaml(기본 흐름 — 인프라만 컨테이너, 앱은 host에서 bootRun):
#       LIVE_HOOKS_HOST=host.docker.internal
#   - b-studio 샌드박스 compose.b-studio.yaml(commerce도 컨테이너, 서비스 이름 그대로):
#       LIVE_HOOKS_HOST=commerce

# HTTP 기반 인증(R2) — publish(송출) 시도마다 이 주소로 물어본다. 2xx면 허용.
# commerce가 action이 "publish"가 아니면(시청 등) 무조건 허용한다(R5 전까지, 코드 쪽 주석 참고).
authMethod: http
authHTTPAddress: http://${LIVE_HOOKS_HOST}:8080/api/v1/live/hooks/auth

# RTMP 송출만 받는다(R1~R3 범위).
rtmp: yes
rtmpAddress: :1935

# HLS는 MediaMTX 기본값이 이미 켜져 있다(hls: yes, hlsAddress: :8888) — 명시적으로 적어
# 둔다. R1~R3 실 송출 확인 범위에 "HLS 재생목록을 받을 수 있는가"가 포함돼 추가했다. 지연
# 측정(R6)·LL-HLS 세부 튜닝은 범위 밖이고, read/playback 액션은 위 authHTTPAddress가 이미
# 무조건 허용한다(R5 로그인 없이 시청 허용은 아직 더 뒤 단계).
hls: yes
hlsAddress: :8888

paths:
  # rtmp://<host>/live/{streamKey} 패턴에만 건다 — LiveStreamPaths.PREFIX("live/")와 짝이다.
  # 선언하지 않은 다른 경로는 MediaMTX 기본 동작(이 패턴에 안 걸리면 거절)을 따른다.
  "~^live/.+$":
    # 송출 시작(R3) — MediaMTX에는 runOnPublish라는 훅이 없다(rtsp-simple-server 시절 이름으로
    # 잘못 적어 뒀던 것 — 실제로 띄워 보니 "unknown field" 에러로 즉시 종료됐다). 경로가
    # "준비됨"(= 퍼블리셔가 붙어 스트림이 흐르기 시작함)으로 바뀌는 훅은 runOnReady다.
    # MediaMTX가 치환하는 $MTX_PATH는 "live/스트림키" 그 문자열이다.
    runOnReady: curl -fsS -X POST http://${LIVE_HOOKS_HOST}:8080/api/v1/live/hooks/publish -d path=$MTX_PATH
    # 끊기면 재시작하지 않는다 — 재접속 유예(30초)는 commerce 쪽 스케줄러가 판단한다.
    runOnReadyRestart: no
    # 송출 종료(R3) — 바로 ENDED가 아니라 "끊긴 시각"만 commerce에 알린다(재접속 유예 시작).
    # 같은 이유로 runOnUnpublish가 아니라 runOnNotReady다(경로가 "준비 안 됨"으로 바뀔 때).
    runOnNotReady: curl -fsS -X POST http://${LIVE_HOOKS_HOST}:8080/api/v1/live/hooks/unpublish -d path=$MTX_PATH
