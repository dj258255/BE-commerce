# Alertmanager — 알림 규칙이 <실제로 갈 곳>을 정한다.
#
# 규칙만 있고 받는 데가 없으면 아무도 모른다. UnknownPaymentAging 이 울려도
# 그래프에만 빨간 줄이 그어질 뿐이다. 관측은 <누가 보느냐>까지가 설계다.
#
# 슬랙 웹훅 URL 은 코드에 두지 않는다. 환경변수로 넣는다.
#   export SLACK_WEBHOOK_URL='https://hooks.slack.com/services/...'
#   alertmanager --config.file=monitoring/alertmanager.yml
global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  receiver: 'slack-ops'
  # 같은 알림이 반복 발화해도 30분에 한 번만 보낸다.
  # 미확정 결제가 쌓이는 상황은 몇 초마다 재알림해도 대응이 빨라지지 않고,
  # 채널이 시끄러워지면 사람이 알림 자체를 끈다.
  # <b>도메인으로 묶는다.</b> 알림 이름으로 묶으면 <b>한 고장이 알림 여러 개를 그대로 내보낸다.</b>
  # 실제로 재 봤다(promtool 시나리오 db-outage-probe): DB 하나가 죽으면 여섯 개가 동시에 뜬다.
  #   PaymentSuccessRateLow · UnknownPaymentAging · CompensationExhausted
  #   OutboxConsumptionStalled · OptimisticLockRetryRising · ReconPendingBacklog
  # 이름으로 묶으면 이게 여섯 건으로 나가고, 도메인으로 묶으면 payment 다섯 + settlement 하나가 된다.
  #
  # 업계 수치로는 온콜이 주 50건을 받는데 실제 조치가 필요한 건 2~5% 다. 교대당 40건을
  # 넘으면 MTTR 이 3배가 된다. 규칙 기반 그룹핑만으로 60~80% 가 줄어든다고 보고돼 있어
  # 여기에 모델을 넣지 않았다 — 도메인은 알림마다 이미 아는 값이라 추론할 것이 없다.
  group_by: ['domain', 'severity']
  # 첫 알림을 30초 더 기다린다. 한 고장에서 뒤따라 뜨는 것들을 같은 묶음에 담기 위해서다.
  # 이 값이 짧으면 첫 알림만 따로 나가고 나머지가 두 번째 묶음이 된다.
  group_wait: 60s
  group_interval: 5m
  repeat_interval: 30m
  routes:
    # 돈이 걸린 것과 그렇지 않은 것을 나눈다. 같은 채널에 섞으면
    # "옛 해시가 남아 있다"와 "미확정 결제가 10분째"가 같은 무게로 보인다.
    - matchers: [severity="critical"]
      receiver: 'slack-critical'
      repeat_interval: 10m

receivers:
  - name: 'slack-ops'
    slack_configs:
      - channel: '#be-commerce-alerts'
        title: '{{ .CommonLabels.alertname }}'
        # 무엇이 울렸는지보다 <무엇을 해야 하는지>를 먼저 보여준다.
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  - name: 'slack-critical'
    slack_configs:
      - channel: '#be-commerce-alerts-critical'
        title: '[critical] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

# 묶는 것만으로는 모자란다 — <원인과 결과가 같은 무게로 나간다>.
#
# group_by 는 여섯 건을 두 묶음(payment 다섯 + settlement 하나)으로 만들 뿐,
# 묶음 안에서 무엇이 원인이고 무엇이 파생인지는 말해 주지 않는다. 사람이 다섯 줄을
# 읽고 스스로 골라야 한다. inhibit 는 <파생을 아예 안 보낸다>.
#
# 억제는 인과가 확실한 것만 건다. 애매하면 안 건다 — 억제된 알림은 울린 적이
# 없으므로, 잘못 걸면 <고장이 조용해진다>. 그래서 아래 넷은 전부 한 방향이고,
# critical 은 억제 대상에 넣지 않았다. 돈이 걸린 판정은 원인이 무엇이든 사람이 본다.
inhibit_rules:
  # 1) 승인이 안 되는 동안 같은 도메인의 warning 은 <같은 고장의 다른 얼굴>이다.
  #    아웃박스가 안 비는 것도 락 재시도가 느는 것도 승인 경로부터 고쳐야 사라진다.
  #    이 하나로 DB 장애 시 여섯 건이 넷이 된다(OutboxConsumptionStalled·OptimisticLockRetryRising 억제).
  #    남는 넷은 critical 셋과 settlement 하나다. 대사는 다른 시간대에 다른 사람이 본다.
  - source_matchers: [alertname="PaymentSuccessRateLow"]
    target_matchers: [severity="warning"]
    equal: ['domain']

  # 2) 속도 제한이 꺼진 동안의 오탐률은 <규칙 하나가 빠진 값>이다.
  #    그 수치를 보고 규칙을 조이면 Redis 가 돌아왔을 때 정탐까지 같이 놓친다.
  - source_matchers: [alertname="FraudVelocityFailOpen"]
    target_matchers: [alertname="FraudFalsePositiveHigh"]
    equal: ['domain']

  # 3) 이미 마감을 넘긴 건에 "마감이 다가온다"가 같이 뜨는 것은 노이즈다.
  #    증빙 제출은 연장이 없어서, 지난 것과 남은 것을 섞으면 남은 것을 놓친다.
  - source_matchers: [alertname="DisputeDeadlineMissed"]
    target_matchers: [alertname="DisputeDeadlineApproaching"]
    equal: ['domain']

  # 4) 재시도가 소진된 뒤의 "재시도가 늘고 있음"은 이미 지난 이야기다.
  #    소진은 사용자가 실패를 본 것이고, 증가는 아직 흡수되고 있다는 뜻이다.
  - source_matchers: [alertname="OptimisticLockExhausted"]
    target_matchers: [alertname="OptimisticLockRetryRising"]
    equal: ['domain']
