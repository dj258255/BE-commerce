# 결제 SLO 알림 룰 — Prometheus alerting rules
# 메트릭명은 Micrometer 노출 기준(카운터 _total 접미사, dot→underscore).
groups:
  - name: payment-slo
    rules:
      # 1) 최근 5분 결제 성공률 < 95%.
      #    분모(전체 승인율)가 0이면 0/0=NaN이라 Prometheus는 알림을 발화하지 않는다
      #    → 트래픽이 없을 때 오탐이 뜨지 않는다.
      #
      #    <b>표본 바닥을 걸었다.</b> 분모가 0이 아니어도 새벽에는 5분에 열 건이 안 들어온다.
      #    그때 한 건이 실패하면 성공률이 90% 로 찍혀 임계를 넘는데, 이건 고장이 아니라
      #    표본이 얇은 것이다. 초당 0.1건(5분에 30건) 밑에서는 비율을 신뢰하지 않는다.
      #
      #    <b>대신 붕괴는 표본과 무관하게 잡는다.</b> 바닥만 걸면 저트래픽 시간대의 진짜
      #    장애가 통째로 조용해진다. 성공률이 50% 밑으로 떨어지는 것은 몇 건이든 고장이므로
      #    두 번째 항으로 따로 뺐다. 둘을 한 알림에 담아 같은 고장에 두 건이 안 나가게 했다.
      - alert: PaymentSuccessRateLow
        expr: |
          (
            sum(rate(payment_confirm_total{outcome="success"}[5m])) / sum(rate(payment_confirm_total[5m])) < 0.95
            and sum(rate(payment_confirm_total[5m])) >= 0.1
          )
          or
          sum(rate(payment_confirm_total{outcome="success"}[5m])) / sum(rate(payment_confirm_total[5m])) < 0.5
        for: 5m
        labels:
          severity: critical
          domain: payment
        annotations:
          summary: "결제 성공률 저하 (< 95%)"
          description: "최근 5분 결제 성공률이 95% 미만입니다. PG 장애/승인 실패 급증 여부를 확인하세요."

      # 2) 보상 재시도 소진 — 수동 개입 필요. 1건이라도 발생하면 즉시 발화.
      - alert: CompensationExhausted
        expr: increase(compensation_exhausted_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
          domain: payment
        annotations:
          summary: "보상 재시도 소진 발생"
          description: "최근 10분 내 보상 재시도가 소진된 건이 있습니다. 수동 개입(어드민 보상 재처리)이 필요합니다."

      # 3) 미확정(UNKNOWN) 결제가 10분 이상 방치됨.
      - alert: UnknownPaymentAging
        expr: payment_unknown_oldest_age_seconds > 600
        for: 5m
        labels:
          severity: critical
          domain: payment
        annotations:
          summary: "미확정 결제 장기 방치 (> 10분)"
          description: "가장 오래된 UNKNOWN 결제가 10분 넘게 미확정 상태입니다. 복구 배치/망취소 동작을 확인하세요."

      # 4) 멱등키 데드락 재시도 폭증 — 분당 10회 초과.
      - alert: DeadlockRetrySpike
        expr: rate(idempotency_deadlock_retry_total[5m]) * 60 > 10
        for: 5m
        labels:
          severity: warning
          domain: payment
        annotations:
          summary: "멱등키 데드락 재시도 폭증 (> 10회/분)"
          description: "멱등키 데드락 재시도가 분당 10회를 초과합니다. 경합/락 대기 증가 여부를 확인하세요."

      # 5) 대사 미해결(PENDING) 적체 — 가장 오래된 건이 15분 넘게 남아 있음.
      #    건수가 아니라 나이를 본다. 예전 식(recon_pending_count > 0 이 15분 지속)은
      #    사람이 제때 종결해도 새 불일치가 이어서 들어오면 큐가 한 번도 비지 않아 울렸고,
      #    한 번 스크레이프가 비면 for 가 처음부터 다시 셌다. 나이는 방치된 건이 있을 때만 자란다.
      #    UnknownPaymentAging·OutboxConsumptionStalled·FraudReviewBacklog 와 같은 모양이다.
      #    나이의 기준은 reconciledAt 이다. 같은 거래일 파일을 다시 올리면 판정을 지우고 새로
      #    쓰므로(deleteByTradeDate) 나이도 0 에서 다시 시작한다 — 재업로드가 알림을 늦춘다.
      - alert: ReconPendingBacklog
        expr: recon_pending_oldest_age_seconds > 900
        for: 5m
        labels:
          severity: warning
          domain: settlement
        annotations:
          summary: "대사 미해결(PENDING) 적체"
          description: "가장 오래된 PENDING 대사 예외가 15분 넘게 남아 있습니다. 어드민에서 예외 큐를 검토·종결하세요."

      # 6) AI 후보 제안이 조용히 멈춤 — 모델이 틀린 게 아니라 아무 답도 안 내는 상태.
      #    핀테크에서 LLM 사고는 대부분 "모델이 틀려서"가 아니라 "틀린 걸 아무도 못 봐서" 난다.
      #    가드에 다 걸려 제안이 0이 되면 기능이 꺼진 것과 같은데, 에러는 한 건도 안 난다.
      - alert: AssistResidualNoSuggestion
        expr: |
          sum(rate(assist_residual_outcome_total{outcome="suggested"}[30m])) == 0
          and sum(rate(assist_residual_outcome_total[30m])) > 0
        for: 30m
        labels:
          severity: warning
          domain: assist
        annotations:
          summary: "AI 잔여 후보 제안이 30분째 0건"
          description: "모델은 불리고 있는데 통과한 제안이 없습니다. 가드 임계나 모델 응답이 바뀌었는지 확인하세요."

      # 7) 조회 재검증 가드가 갑자기 자주 걸림 — 모델이 없는 숫자를 쓰기 시작했다는 신호.
      #    이 가드는 원래 드물게 걸려야 한다. 비율이 뛰면 프롬프트나 모델이 바뀐 것이다.
      - alert: AssistUnsourcedFiguresSpike
        expr: |
          sum(rate(assist_residual_outcome_total{outcome="unsourced_figures"}[1h]))
          / sum(rate(assist_residual_outcome_total[1h])) > 0.2
        for: 1h
        labels:
          severity: warning
          domain: assist
        annotations:
          summary: "AI 응답의 출처 없는 숫자 비율 급증"
          description: "숫자 검증기에 걸리는 비율이 20%를 넘었습니다. 모델이나 프롬프트가 바뀌었는지 확인하세요."

      # 7-1) 서술이 계속 템플릿으로만 나감 — 모델을 켰는데 실질은 꺼진 상태.
      #      이게 가장 잡기 어려운 모양이다. 폴백이 있으니 화면은 늘 채워지고 에러도 안 난다.
      #      운영자는 평소와 똑같은 화면을 보므로 아무도 이상하다고 말하지 않는다.
      #      6번과 성격이 같은데, 그쪽은 화면이 비어서 티가 나고 이쪽은 티가 안 난다.
      - alert: AssistNarrativeAlwaysFallingBack
        expr: |
          sum(rate(assist_narrative_outcome_total{outcome="fell_back_to_template"}[30m]))
          / sum(rate(assist_narrative_outcome_total{outcome=~"narrated|fell_back_to_template"}[30m])) > 0.5
        for: 30m
        labels:
          severity: warning
          domain: assist
        annotations:
          summary: "운영자용 서술의 절반 이상이 템플릿 폴백"
          description: "모델 서술이 가드에 걸리거나 모델 서버가 응답하지 않고 있습니다. 화면은 채워지므로 티가 안 납니다."

      # 7-2) 모델이 금액을 빠뜨리는 비율 급증 — 프롬프트나 모델이 바뀐 신호.
      #      실측에서 30건 중 0~4건이었다. 그 위로 뛰면 다른 일이 생긴 것이다.
      - alert: AssistNarrativeDroppedAmountsSpike
        expr: |
          sum(rate(assist_narrative_outcome_total{outcome="dropped_amounts"}[1h]))
          / sum(rate(assist_narrative_outcome_total[1h])) > 0.2
        for: 1h
        labels:
          severity: warning
          domain: assist
        annotations:
          summary: "서술이 금액을 빠뜨리는 비율 급증"
          description: "금액 결손 가드에 걸리는 비율이 20%를 넘었습니다. 실측 기준선은 30건 중 0~4건입니다."

      # 7-3) 장애 원인 분석에서 모델이 조용히 답을 안 냄.
      #      규칙이 기권한 자리에만 모델이 불린다. 그 자리가 통째로 비면 켜기 전 상태로
      #      돌아간 것인데, 규칙이 답한 건은 그대로 나오므로 지표를 안 보면 모른다.
      - alert: AssistIncidentModelSilent
        expr: |
          sum(rate(assist_incident_outcome_total{outcome="by_model"}[1h])) == 0
          and sum(rate(assist_incident_outcome_total{outcome=~"model_silent|model_ungrounded"}[1h])) > 0
        for: 1h
        labels:
          severity: warning
          domain: assist
        annotations:
          summary: "장애 원인 분석에서 모델이 1시간째 한 건도 답하지 못함"
          description: "규칙이 기권한 건이 통째로 비고 있습니다. 모델 서버나 가드 임계를 확인하세요."

      # 7-4) 이의제기 대응 기한 임박 — 이 시스템에서 외부 하드 기한이 있는 유일한 사람 대기열.
      #      이상거래 심사는 밀려도 늦게나마 할 수 있지만, 이의제기는 기한을 넘기면 다툴 기회
      #      자체가 사라지고 그대로 패소가 되어 대금이 회수된다. 늦은 대응과 안 한 대응이 같다.
      #      넘기는 순간에는 아무 에러도 안 난다. 행은 그대로 OPEN 이고 어느 날 패소 통보만 온다.
      - alert: DisputeDeadlineApproaching
        expr: dispute_nearest_deadline_seconds < 172800 and dispute_open_count > 0
        for: 10m
        labels:
          severity: warning
          domain: dispute
        annotations:
          summary: "이의제기 대응 기한이 48시간 안으로 들어옴"
          description: "증빙을 제출하지 않은 건이 있고 가장 임박한 기한이 48시간 미만입니다. 넘기면 다툴 수 없습니다."

      # 7-5) 이미 기한을 넘긴 건이 남아 있음 — 놓친 것을 늦게라도 알아야 한다.
      #      남은 시간이 음수인 것은 기한이 지났다는 뜻이다. 0 으로 깎지 않는 이유가 이것이다.
      - alert: DisputeDeadlineMissed
        expr: dispute_nearest_deadline_seconds < 0 and dispute_open_count > 0
        for: 10m
        labels:
          severity: critical
          domain: dispute
        annotations:
          summary: "대응 기한이 지난 이의제기가 남아 있음"
          description: "기한을 넘긴 건이 OPEN 으로 남아 있습니다. 사실상 패소이며 대금 회수를 예상해야 합니다."

      # 8) 이상거래 심사 적체 — 사람이 봐야 하는 건이 오래 방치되고 있음.
      #    심사가 밀리면 사기로 의심되는 결제가 그대로 정산으로 넘어간다. 미확정 결제가
      #    떠 있는 것과 성격이 같아 같은 모양으로 잡는다.
      #    건수가 아니라 "가장 오래된 건의 나이"를 본다 — 열 건이 방금 들어온 것과
      #    한 건이 이틀 묵은 것은 위험이 다르다.
      - alert: FraudReviewBacklog
        expr: fraud_review_oldest_age_seconds > 3600
        for: 10m
        labels:
          severity: warning
          domain: fraud
        annotations:
          summary: "이상거래 심사 적체"
          description: "사람 심사를 1시간 넘게 기다린 이상거래 건이 있습니다. 어드민 심사 큐를 확인하세요."

      # 6) 비밀번호 해시 이관 정체 — 레거시 해시가 오래 남아 있음(ADR-009).
      #    이관은 로그인한 사람만 된다(원문이 그때만 존재). 이 값이 0이 되어야 레거시 인코더를
      #    제거할 수 있으므로, 줄지 않으면 재설정 유도 같은 별도 조치를 판단해야 한다.
      #    경보가 아니라 "언제 끝나는지 보이게" 하는 용도라 심각도는 info다.
      - alert: PasswordHashMigrationStalled
        expr: password_hash_legacy_count > 0
        for: 7d
        labels:
          severity: info
          domain: security
        annotations:
          summary: "비밀번호 해시 이관 미완료 (레거시 {{ $value }}건)"
          description: "현재 알고리즘으로 옮겨지지 않은 해시가 7일 넘게 남아 있습니다. 휴면 계정으로 보이면 재설정 유도를 검토하세요. 0이 되면 레거시 인코더를 제거할 수 있습니다."

      # 7) 아웃박스 소비 정체 — 미소비 이벤트가 오래 방치됨(V24, OutboxMetrics).
      #    @ApplicationModuleListener는 커밋 이후 별도 스레드에서 돈다. 결제가 200으로 나간 뒤에도
      #    정산·원장·알림·에스크로는 아직일 수 있고, 그 시차 자체는 정상이다.
      #    그래서 개수가 아니라 <나이>에 건다 — 부하 중엔 수천 건이 밀려도 곧 빠지지만(실측:
      #    22,492건 → 6,174건), 몇 건뿐이어도 안 빠지면 소비가 멈춘 것이다. 후자만 사고다.
      #    소비가 멈추면 겉으로는 "결제는 되는데 원장이 안 쌓인다"로 보인다 — 늦게 알수록 손해가 크다.
      - alert: OutboxConsumptionStalled
        expr: outbox_pending_oldest_age_seconds > 300
        for: 5m
        labels:
          severity: warning
          domain: payment
        annotations:
          summary: "아웃박스 소비 정체 (최고령 {{ $value }}초)"
          description: "5분 넘게 소비되지 않은 이벤트가 있습니다. 비동기 실행기 스레드 고갈, 리스너 예외 반복, DB 잠금을 확인하세요. 재기동 시에는 republish-outstanding-events-on-restart로 재발행됩니다."

      # 8) 전역 유입 제한이 지속적으로 걸림 — 상한이 실제 처리 능력보다 낮거나, 정말로 포화다.
      #    scope로 갈린다: global이 오르면 시스템 차원 문제이고, user/ip만 오르면 특정 클라이언트
      #    남용이라 상한을 올릴 일이 아니다. 그래서 이 규칙은 global만 본다.
      #    판별법: 처리량(http_server_requests)이 ratelimit_limit_global 근처에서 평평하면 진짜 포화,
      #    한도보다 한참 낮은데도 거절이 나면 상한이 낮게 잡힌 것이다(k6/capacity-knee.js로 재측정).
      #    경보가 아니라 "튜닝할 때가 됐다"는 신호라 warning이다.
      - alert: GlobalRateLimitBinding
        expr: sum(rate(ratelimit_rejected_total{scope="global"}[5m])) > 1
        for: 15m
        labels:
          severity: warning
          domain: payment
        annotations:
          summary: "전역 유입 상한이 지속적으로 걸리는 중 (초당 {{ $value | printf \"%.1f\" }}건 거절)"
          description: "15분 넘게 전역 층에서 거절이 이어집니다. 처리량이 상한 근처에서 평평한지 확인하세요. 평평하면 증설, 한참 낮은데도 거절되면 app.ratelimit.global-per-sec가 낮게 잡힌 것입니다(k6/capacity-knee.js로 재측정)."

      # 9) 낙관적 락 재시도가 늘고 있다 — <성공한 요청>에는 아무 흔적이 안 남는 자리다.
      #    재시도가 충돌을 흡수하므로, 최종 결과만 보면 다섯 번 만에 성공한 요청이 한 번에 성공한
      #    요청과 구별되지 않는다. 늘어난 지연은 응답 시간 안에 묻히고 에러율은 그대로다.
      #    그래서 <논리적 호출>이 아니라 <실제 시도>를 따로 센다.
      #    이게 오르면 경합이 실제로 있다는 뜻이고, 소진(exhausted)까지 오르면 사용자가 실패를 본다.
      #    경보가 아니라 "락 전략을 다시 볼 때가 됐다"는 신호라 warning이다.
      - alert: OptimisticLockRetryRising
        expr: sum(rate(stock_deduct_retry_total[5m])) + sum(rate(wallet_mutate_retry_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
          domain: payment
        annotations:
          summary: "낙관적 락 재시도가 늘고 있음 (초당 {{ $value | printf \"%.1f\" }}회)"
          description: "재시도가 충돌을 흡수해 성공률·에러율에는 안 나타나는 경합입니다. 10분 넘게 이어지면 락 전략(조건부 UPDATE)으로 옮길 때가 된 것입니다(ADR-004의 실측 비교 참고)."

      # 10) 재시도를 다 쓰고 실패했다 — 여기서부터는 사용자가 실패를 본다.
      - alert: OptimisticLockExhausted
        expr: sum(rate(stock_deduct_exhausted_total[5m])) + sum(rate(wallet_mutate_exhausted_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
          domain: payment
        annotations:
          summary: "낙관적 락 재시도 소진 — 사용자에게 실패가 나가는 중"
          description: "재시도 상한을 소진해 STOCK_CONCURRENCY / WALLET_CONCURRENCY 로 실패하고 있습니다. 경합이 재시도로 흡수되는 수준을 넘었습니다."

      # 11) 속도 제한이 조용히 꺼져 있다 — fail-open 은 결제를 세우지 않는 대신 규칙 하나를 뺀다.
      #     이상거래가 몰리는 때와 Redis 가 흔들리는 때가 겹치면 가장 필요한 순간에 규칙이 없다.
      #     결제를 막지는 않으므로 성공률·에러율에는 안 나타난다. 이 카운터만 오른다.
      - alert: FraudVelocityFailOpen
        expr: sum(rate(fraud_velocity_fail_open_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          domain: fraud
        annotations:
          summary: "이상거래 속도 제한이 Redis 실패로 건너뛰어지는 중 (초당 {{ $value | printf \"%.2f\" }}회)"
          description: "그 시간대의 FDS 판정은 속도 규칙이 빠진 값입니다. Redis 상태를 먼저 보고, 이어진 시간대의 승인 건은 사후 심사에서 다시 보십시오."

      # 12) 오탐이 너무 많다 — 규칙이 정상 거래를 잡고 있고, 그 비용은 사람 심사 시간이다.
      #     판정 표본이 얇을 때 비율만 보면 2건 중 1건이 50% 로 잡히므로 건수도 함께 건다.
      - alert: FraudFalsePositiveHigh
        expr: fraud_review_false_positive_ratio > 0.7 and fraud_review_judged_count >= 20
        for: 30m
        labels:
          severity: warning
          domain: fraud
        annotations:
          summary: "이상거래 심사 오탐률 {{ $value | printf \"%.0f\" }}% — 규칙이 정상 거래를 잡고 있음"
          description: "사람이 처리한 심사 열 건 중 일곱 건 이상이 정상이었습니다. 임계나 규칙을 조일 때가 된 것이고, 그대로 두면 심사 큐가 사람 시간만 씁니다."

      # 13) 활동 반영이 멈춤 — 원인은 커넥터일 수도, 컨슈머일 수도, 브로커일 수도 있다.
      #     CDC 로 전달하면 발행 보장의 근거가 아웃박스에서 binlog·커넥터 건강으로 옮겨간다.
      #     커넥터가 죽어도, 컨슈머 빈이 빠져도, 브로커가 멈춰도 <b>셋 다 RUNNING·정상으로 보인다</b>
      #     (실제로 둘을 겪었다 — MySQL 8.4 비호환으로 RUNNING 인 채 재시작만 돌던 커넥터, 그리고
      #     컨슈머 빈이 없어 아무도 안 읽던 것). 그래서 <b>원인이 아니라 증상</b>을 잰다 —
      #     *활동이 컨텍스트에 닿고 있는가*. 이건 전달 방식과 무관하게 성립한다(#215).
      #
      #     <b>개수가 아니라 나이다.</b> 밀리는 중과 멈춤은 개수로 구분되지 않는다(부하 중엔 정상적으로
      #     밀린다). outbox_pending_oldest_age_seconds·payment_unknown_oldest_age_seconds 와 같은 결이다.
      #
      #     <b>임계값 60초의 근거.</b> E1b 실측에서 정상 lag p95 는 13~14ms 였다
      #     (personalization/docs/runs/20260923-e1b-cdc-대-아웃박스/report.md — 아웃박스 14ms,
      #     튜닝한 CDC 13ms). 60초는 그 4,000배 남짓이라 지터나 일시적 적체로는 절대 닿지 않는다.
      #     낮게 잡아 빨리 알리되, 아래 트래픽 게이트로 오탐을 막는다.
      #
      #     <b>트래픽이 없을 때와 고장을 가른다.</b> 활동이 안 들어오면 나이는 정상적으로도 자란다 —
      #     한가한 시간대에 울리면 안 된다. 그래서 <b>활동 쓰기가 실제로 들어오고 있다</b>는 조건을
      #     함께 건다(최근 10분 초당 0.05건 = 20초에 1건 이상). 쓰기가 들어오는데 60초 넘게 반영이
      #     없으면 그건 유휴가 아니라 파이프라인 정지다. 게이트의 지표는 Spring Boot 기본 웹 메트릭의
      #     템플릿 uri 태그다.
      #
      #     <b>기동 직후는 울리지 않는다.</b> 나이 게이지는 한 번도 반영된 적이 없으면 <b>0</b>을
      #     내보낸다(0 > 60 은 거짓). 첫 반영 전의 값은 "나이"로 의미가 없다. 대가는 아래에 적었다.
      # 13-b) 기동 후 한 번도 반영하지 못한 상태 — 위 규칙의 사각지대를 메운다.
      #     나이 게이지는 첫 반영 전에 0 을 내보내므로 `> 60` 이 거짓이다. 그래서 **나이가 아니라
      #     반영이 일어났는가**를 본다. 이 구간이 위험한 이유는 실제로 겪었기 때문이다 — 컨슈머 빈이
      #     조건 때문에 아예 안 만들어져 **기동부터 끝까지 한 건도 반영되지 않았고**, 커넥터는 정상,
      #     앱 로그는 오류 0건이었다. 나이 규칙만 있으면 그 사고가 영원히 안 울린다.
      #
      #     같은 트래픽 게이트를 쓴다. 쓰기가 들어오는데 10분 동안 반영이 한 건도 없으면 정지다.
      #     `for: 5m` 을 더해 배포 직후의 짧은 공백으로는 울지 않게 한다.
      - alert: PersonalizationContextNeverApplied
        expr: |
          sum(increase(personalization_context_applied_total[10m])) == 0
          and sum(rate(http_server_requests_seconds_count{uri="/api/v1/personalization/activity"}[10m])) > 0.05
        for: 5m
        labels:
          severity: critical
          domain: personalization
        annotations:
          summary: "활동 쓰기는 들어오는데 반영이 한 건도 없음"
          description: "10분간 컨텍스트 반영이 0건인데 활동 쓰기는 들어오고 있습니다. 나이 게이지가 잡지 못하는 구간입니다(첫 반영 전에는 0을 내보냅니다). 컨슈머 빈이 조건 때문에 안 만들어진 경우가 여기 해당합니다 — 커넥터와 앱 로그가 모두 정상으로 보입니다(#215)."

      #     <b>탐지까지 걸리는 시간(실측, 2026-09-23).</b> 커넥터를 실제로 삭제하고 쟀다.
      #     나이는 선형으로 자라고 <b>죽인 뒤 46초</b>에 60을 넘었다 — 죽는 순간 나이가 17.8초였고
      #     남은 42.2초가 실시간으로 흘렀다. 즉 <b>임계 돌파 = 60초 − 죽는 순간의 나이</b>이고
      #     최악(나이 0에서 죽음)이 60초다. 여기에 `for: 5m`(300초)과 평가 주기(15초)가 더해져
      #     <b>경보까지 최대 약 375초</b>다. 같은 실험에서 반영 카운터는 20초 간격으로 2677 → 2677 로
      #     완전히 멈췄다(아래 13-b 가 그 상태를 본다).
      - alert: PersonalizationContextApplyStalled
        expr: |
          personalization_context_last_applied_age_seconds > 60
          and sum(rate(http_server_requests_seconds_count{uri="/api/v1/personalization/activity"}[10m])) > 0.05
        for: 5m
        labels:
          severity: critical
          domain: personalization
        annotations:
          summary: "활동이 컨텍스트에 반영되지 않고 있음"
          description: "활동 쓰기는 들어오는데 마지막 반영이 60초를 넘었습니다. CDC 커넥터/binlog·컨슈머 빈·브로커를 확인하세요 — 셋 다 RUNNING 으로 보이면서 조용히 멈출 수 있습니다(#215). 기동 후 한 번도 반영하지 못한 상태는 나이 게이지가 0이라 이 규칙이 잡지 못합니다(지표가 0으로 노출되는지에 따라 별도 규칙이 필요)."

  # 고정 임계값이 못 보는 것 — <이 시간대에는 원래 이 정도였는가>.
  #
  # 위의 95% 는 하루 종일 같은 숫자다. 그런데 결제는 요일과 시간대로 모양이 크게 다르다.
  # 평일 점심의 96% 와 새벽의 96% 는 같은 값이 아니다. 앞의 것은 평소보다 3%p 떨어진
  # 것일 수 있고 뒤의 것은 평소 그대로일 수 있는데, 임계 하나로는 둘을 못 가른다.
  #
  # <b>모델을 쓰지 않는다.</b> 이 자리의 baseline 은 <지난주 같은 요일 같은 시각>이면
  # 충분하다. 요일과 시간대가 곧 결제량의 주기라서, 학습해야 알 수 있는 것이 아니다.
  # 모델을 넣으면 "왜 울렸는가"를 설명해야 하는 자리가 하나 더 늘 뿐이다.
  #
  # <b>첫 일주일은 조용하다.</b> offset 1w 가 빈 값을 돌려주므로 비교가 성립하지 않는다.
  # 이건 결함이 아니라 전제다. 비교할 지난주가 없으면 baseline 도 없다.
  - name: payment-baseline
    rules:
      # 30분 창으로 성공률을 미리 계산해 둔다. offset 비교를 알림 식에서 두 번 쓰기 때문에
      # 기록 규칙으로 빼지 않으면 같은 식이 네 번 들어간다.
      - record: payment:confirm_success_ratio:rate30m
        expr: sum(rate(payment_confirm_total{outcome="success"}[30m])) / sum(rate(payment_confirm_total[30m]))

      # 13) 지난주 같은 시각보다 2%p 넘게 낮다.
      #
      #     <b>2%p 로 잡은 이유.</b> 처음에 5%p 로 썼다가 지웠다. 성공률 상한이 1.0 이라
      #     5%p 가 떨어지면 이미 95% 밑이고, 그러면 위의 절대 임계가 먼저 울린다.
      #     <b>혼자서는 절대 안 울리는 규칙</b>이 되는 것이다. 이 알림이 값을 하는 구간은
      #     "아직 SLO 안이지만 평소보다 낮다"뿐이라, 폭이 그 안에 들어와야 한다.
      #
      #     <b>표본 바닥이 위보다 높다(초당 0.3건 = 30분에 540건).</b> 2%p 는 좁아서
      #     표본이 얇으면 흔들림에 묻힌다. 성공률 0.98 에서 표준편차가 √(0.98·0.02/N) 이라
      #     540건이면 0.006 이고 2%p 는 그 3.3배다. 180건이면 1.9배라 절반이 잡음이 된다.
      #     양쪽 다 건다 — 지난주 그 시각이 한산했으면 비교 자체가 성립하지 않는다.
      - alert: PaymentSuccessRateBelowWeeklyBaseline
        expr: |
          payment:confirm_success_ratio:rate30m
            < (payment:confirm_success_ratio:rate30m offset 1w) - 0.02
          and sum(rate(payment_confirm_total[30m])) >= 0.3
          and sum(rate(payment_confirm_total[30m] offset 1w)) >= 0.3
        for: 15m
        labels:
          severity: warning
          domain: payment
        annotations:
          summary: "결제 성공률이 지난주 같은 시각보다 2%p 넘게 낮음 (현재 {{ $value | printf \"%.3f\" }})"
          description: "절대 임계(95%)는 아직 안 넘었지만 같은 요일 같은 시각 대비 2%p 넘게 떨어졌습니다. 특정 카드사·결제수단만 빠지는 중인지 먼저 보십시오."
