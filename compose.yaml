services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: becommerce
      MYSQL_USER: becommerce
      MYSQL_PASSWORD: becommerce
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    # Debezium CDC는 행 단위 전후 이미지를 읽는다 — ROW와 FULL이 둘 다 있어야 변경 내용이 만들어진다.
    command:
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog_row_image=FULL
      - --server-id=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 결제 이벤트 외부화용 Kafka(KRaft 단일 브로커 — ZooKeeper 없음).
  # 호스트는 KAFKA_BOOTSTRAP=localhost:9092, 컨테이너는 kafka:29092 로 연결한다.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 리스너가 둘인 이유: 클라이언트는 <접속한 주소>가 아니라 <브로커가 광고한 주소>로 다시 붙는다.
      # 광고가 localhost:9092 하나뿐이면 컨테이너 안에서는 그 localhost가 자기 자신이라 못 붙는다 —
      # 그래서 컨테이너용 광고 주소(kafka:29092)를 따로 둔다. 하나로는 호스트와 컨테이너를 같이 못 만족한다.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # 외부화 producer가 payment.confirmed / payment.canceled 첫 발행 시 토픽을 자동 생성한다
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # CDC — mysql binlog를 읽어 Kafka로 흘린다. cdc 프로필로만 기동한다(기본 up에는 포함되지 않음).
  #   docker compose --profile cdc up -d debezium
  debezium:
    image: debezium/connect:2.7
    profiles: ["cdc"]
    ports:
      - "8083:8083"
    environment:
      # 호스트용 9092는 광고 주소일 뿐 컨테이너 안에서는 자기 자신이라 못 붙는다 — 내부 주소를 쓴다.
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # 관측성 스택 — monitoring 프로필로만 기동한다(기본 up에는 포함되지 않음).
  #   docker compose --profile monitoring up -d prometheus grafana
  # 앱은 호스트 8080에서 bootRun으로 띄우고, prometheus가 host.docker.internal:8080을 스크레이프한다.
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    ports:
      # 로컬 전용 바인딩 — 메트릭이 LAN에 노출되지 않게 127.0.0.1로 묶는다.
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    extra_hosts:
      # 리눅스 호환 — host.docker.internal이 호스트를 가리키게 한다.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["monitoring"]
    ports:
      # 로컬 전용 바인딩 — 대시보드를 LAN에 노출하지 않는다.
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # 최소권한 — 데모는 대시보드를 보기만 하면 되므로 Viewer.
      # Admin이면 익명 사용자가 데이터소스를 추가해 내부 서비스로 SSRF 피벗이 가능해진다.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    depends_on:
      - prometheus

  # 애플리케이션 — 이미지로 굽고 인프라에 붙인다.
  #   docker compose --profile app up -d
  #
  # 프로파일을 둔 이유: 기본 `docker compose up -d`(인프라만)로 개발하고 앱은 bootRun으로 띄우는
  # 기존 흐름을 깨지 않기 위해서다 — 앱도 8080을 쓰므로 둘을 동시에 띄우면 포트가 충돌한다.
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # bootRun과 같은 포트를 쓴다. 동시에 띄우지 않는다.
      - "${APP_PORT:-8080}:8080"
    environment:
      # application.yml의 기본값이 localhost라 컨테이너 안에서는 못 쓴다 — 서비스 이름으로 덮는다.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/becommerce?serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATA_REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:29092
      # 업로드 이미지는 리포지토리 밖 산출물이다(29GB). 이미지에 굽지 않고 볼륨으로 붙인다.
      APP_UPLOADS_DIR: /app/uploads
      # kafka 프로파일이 이벤트 외부화를 켠다(= 전체 스택).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-kafka}
    volumes:
      - ${UPLOADS_DIR:-./personalization/data/hm/images}:/app/uploads:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Flyway V1~V65 validate + JPA 부팅까지 걸리는 시간. 넉넉히 준다.
      start_period: 90s

  # 결제 이벤트를 프로세스 밖에서 소비하는 별도 워커 — Kafka 외부화(ADR-005)가 실제로 되는지 보이는 자리다.
  # 웹서버가 없어 HTTP 헬스체크를 쓸 수 없다.
  consumer:
    profiles: ["app"]
    build:
      context: .
      dockerfile: consumer-app/Dockerfile
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
