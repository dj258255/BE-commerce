<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개인화 · 생성 범위와 계산 예산</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/pz.css">
</head>
<body>
<header id="app-top"></header>
<main class="page"><div class="container">
  <div class="head">
    <h1>생성 범위와 계산 예산</h1>
    <p>홈 전체를 autoregressive로 생성하면 inference가 길어진다. <b>범위를 늘린 대가가 전체 예산에서 얼마인가.</b></p>
  </div>
  <div class="grid g4" id="kpis" style="margin-bottom:16px"></div>
  <section class="panel" style="margin-bottom:16px">
    <h2>모델이 e2e에서 차지하는 몫</h2>
    <div class="hint">같은 하드웨어로 처리할 수 있는 요청 수(throughput)가 함께 떨어진다.</div>
    <div id="share"></div>
  </section>
  <section class="panel" style="margin-bottom:16px">
    <h2>구간별 분해</h2>
    <div class="hint">context·constraint·직렬화는 거의 고정이다. 늘어나는 건 inference뿐이다.</div>
    <div id="table"></div>
  </section>
  <section class="panel"><h2>결론과 트레이드오프</h2><div id="conclusion"></div></section>
  <p class="foot-note" id="harness"></p>
</div></main>
<footer id="app-foot"></footer>
<script src="assets/pz.js"></script>
<script>
  PZ.header('console');
  (async function () {
    var d = await PZ.fixture('exp-budget'); if (!d) return;
    var rank = d.modes[0], full = d.modes[2];
    document.getElementById('kpis').innerHTML =
      PZ.kpi('latency 예산', PZ.ms(d.budgetMs), '이 안에 다 넣어야 한다') +
      PZ.kpi('전부 AR e2e', PZ.ms(full.e2eMs), '예산의 ' + PZ.pct(full.e2eMs / d.budgetMs * 100, 0) + ' 소진', 'bad') +
      PZ.kpi('throughput', PZ.num(full.throughputRps) + 'rps', '전부 ranking ' + PZ.num(rank.throughputRps) + 'rps 대비', 'bad') +
      PZ.kpi('앞부분 AR e2e', PZ.ms(d.modes[1].e2eMs), '예산의 ' + PZ.pct(d.modes[1].e2eMs / d.budgetMs * 100, 0), 'warn');

    PZ.bars(document.getElementById('share'), d.share);

    PZ.table(document.getElementById('table'),
      [{ key: 'mode', label: '모드' },
       { key: 'contextMs', label: 'context', num: true },
       { key: 'rankMs', label: 'ranking', num: true },
       { key: 'arMs', label: 'AR', num: true },
       { key: 'constraintMs', label: 'constraint', num: true },
       { key: 'postMs', label: '직렬화', num: true },
       { key: 'e2eMs', label: 'e2e(ms)', num: true },
       { key: 'throughputRps', label: 'rps', num: true }],
      d.modes);

    var c = d.conclusion;
    document.getElementById('conclusion').innerHTML =
      '<p style="margin:0 0 10px">' + PZ.esc(c.statement) + '</p>' +
      '<p style="margin:0 0 10px;color:var(--sub)"><b>트레이드오프</b> — ' + PZ.esc(c.tradeoff) + '</p>' +
      '<div class="badge b-warn">경계 — ' + PZ.esc(c.openQuestion) + '</div>';
    document.getElementById('harness').textContent = '하네스: ' + d._harness;
  })();
</script>
</body>
</html>
