name: measurement

# 실 DB 로 비용·지연을 재는 측정 테스트(@Tag("measurement"), #274). PR 마다 돌리면 통합 테스트 잡의 70%(약 14분)를
# 써서 매일 한 번과 수동 실행으로 옮겼다. 측정값이 판정선을 넘으면 여기서 실패한다 — PR 이 아니라 다음 날 아침에 안다.
on:
  schedule:
    - cron: '0 18 * * *'      # 매일 03:00 KST
  workflow_dispatch:

concurrency:
  group: measurement
  cancel-in-progress: false

jobs:
  measurement:
    name: measurement (real DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run measurement tests (Testcontainers)
        run: ./gradlew -p commerce measurementTest --console=plain

      - name: Check skipped tests (건너뛴 테스트는 통과가 아니다)
        run: python3 tools/check_skipped_tests.py commerce/build/test-results/measurementTest ci/allowed-skips.txt

      - name: Upload measurement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurement-report
          path: commerce/build/reports/tests/measurementTest
          if-no-files-found: ignore
          retention-days: 14
