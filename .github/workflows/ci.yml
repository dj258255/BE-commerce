name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 같은 브랜치에서 새 푸시가 오면 진행 중인 실행을 취소해 러너 시간을 아낀다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # CI에는 NODE_ENV=production 이 없지만, devDependencies 누락으로 빌드가 깨지는 일을 막기 위해
      # npm ci 를 명시적으로 쓴다(락파일 기준 설치라 재현된다).
      - name: Install
        working-directory: apps/web
        run: npm ci

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      # 백엔드 없이 도는 빌드다. 홈은 force-dynamic 이라 빌드 시 API를 호출하지 않는다.
      - name: Build
        working-directory: apps/web
        run: npm run build

  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 전체 테스트 = 단위·슬라이스 + Spring Modulith 경계 검증(ModularityTests).
      # Testcontainers/실 DB 없이 결정적으로 도는 스위트라 러너에 Docker가 필요 없다.
      - name: Run tests
        run: ./gradlew clean test --console=plain

      # "테스트가 초록"이 아니라 "검증하기로 한 테스트가 실제로 돌았는가"를 본다.
      # 환경변수·키·아티팩트가 없으면 테스트는 조용히 skip되고 빌드는 성공한다 —
      # 그러면 검증하지 않은 기능이 초록불 아래로 나간다. 의도적 예외는 ci/allowed-skips.txt 에
      # 이유와 함께 적는다.
      - name: Check skipped tests (건너뛴 테스트는 통과가 아니다)
        run: python3 tools/check_skipped_tests.py build/test-results/test ci/allowed-skips.txt

      # consumer-app은 별도 Gradle 프로젝트(독립 빌드)라 위 test에 포함되지 않는다.
      # Kafka 소비자가 깨진 채 머지되지 않도록 CI에서 함께 빌드·검증한다.
      - name: Build consumer-app (독립 프로젝트)
        run: ./gradlew -p consumer-app build --console=plain

      # 실패해도 리포트는 남겨 원인 파악을 돕는다.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  # 실 MySQL(Testcontainers) 위에서 승인/취소가 DB에 확정되는지 검증하는 통합 테스트.
  # 로컬에선 컨테이너 부팅이 무겁고 hang 이력이 있어 기본 스위트에서 제외하고, Docker가 있는 CI에서만 돈다.
  alert-rules:
    name: alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 알림은 이름이 맞아도 조건식이 틀리면 안 울린다. 그리고 안 울리는 알림은
      # 잘 도는 알림과 화면에서 구별되지 않는다. rate() 를 쓰는 알림은 시계열이
      # 있어야 검사되므로 자바 테스트로는 못 잡고, promtool 이 그 자리를 맡는다.
      - name: Check rule syntax
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool \
            prom/prometheus:latest check rules /m/alert-rules.yml
      - name: Run alert rule tests
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool \
            prom/prometheus:latest test rules /m/tests/alert-rules-test.yml
      # 한 고장이 알림 몇 건을 만드는지 고정한다. 늘어나면 여기서 먼저 보인다.
      - name: Check alert co-firing on a single fault
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool \
            prom/prometheus:latest test rules /m/tests/db-outage-probe.yml
      # 비율 알림은 분모가 작을 때 거짓말을 한다. 표본 바닥과 붕괴 예외를 고정한다.
      - name: Check success-rate sampling floor
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool \
            prom/prometheus:latest test rules /m/tests/success-rate-sampling-test.yml
      # 주간 baseline 알림이 <절대 임계가 안 우는 구간>에서 우는지 본다.
      # 폭을 잘못 잡으면 절대 임계에 가려 혼자서는 영영 안 우는 규칙이 된다.
      - name: Check weekly baseline alert
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool \
            prom/prometheus:latest test rules /m/tests/weekly-baseline-test.yml
      # 억제 규칙은 문법이 틀려도 알림이 안 멈춘다 — <조용히 안 걸릴> 뿐이다.
      # 웹훅 URL 은 실행 시 환경변수로 들어가므로 검사용 더미로 바꿔 넣는다.
      - name: Check alertmanager config
        run: |
          mkdir -p build/am
          sed "s|'\${SLACK_WEBHOOK_URL}'|'https://hooks.slack.com/services/T0/B0/XXXX'|" \
            monitoring/alertmanager.yml > build/am/alertmanager.yml
          docker run --rm -v "$PWD/build/am:/m" --entrypoint amtool \
            prom/alertmanager:latest check-config /m/alertmanager.yml
      # 문법이 맞아도 억제가 걸리는지는 모른다. 살아 있는 alertmanager 에 알림 여섯을
      # 밀어 넣고 몇 건이 안 억제된 채 남는지 센다. 억제는 안 걸려도 조용해서
      # 이 검사가 없으면 소음이 줄었는지 아닌지를 사람이 알 방법이 없다.
      - name: Measure alert inhibition
        run: ./monitoring/tests/run-inhibit-probe.sh

  integration-test:
    name: integration test (real DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run integration tests (Testcontainers)
        run: ./gradlew integrationTest --console=plain

      # 통합 테스트도 같은 기준으로 본다. 실제 PG 키가 없어 건너뛰는 계약 테스트는
      # ci/allowed-skips.txt 에 이유와 함께 등록돼 있다.
      - name: Check skipped tests (건너뛴 테스트는 통과가 아니다)
        run: python3 tools/check_skipped_tests.py build/test-results/integrationTest ci/allowed-skips.txt

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: build/reports/tests/integrationTest
          if-no-files-found: ignore
          retention-days: 7
