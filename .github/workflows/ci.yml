name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 같은 브랜치에서 새 푸시가 오면 진행 중인 실행을 취소해 러너 시간을 아낀다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # CI에는 NODE_ENV=production 이 없지만, devDependencies 누락으로 빌드가 깨지는 일을 막기 위해
      # npm ci 를 명시적으로 쓴다(락파일 기준 설치라 재현된다).
      - name: Install
        working-directory: apps/web
        run: npm ci

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      # 백엔드 없이 도는 빌드다. 홈은 force-dynamic 이라 빌드 시 API를 호출하지 않는다.
      - name: Build
        working-directory: apps/web
        run: npm run build

  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 전체 테스트 = 단위·슬라이스 + Spring Modulith 경계 검증(ModularityTests).
      # Testcontainers/실 DB 없이 결정적으로 도는 스위트라 러너에 Docker가 필요 없다.
      - name: Run tests
        run: ./gradlew -p commerce clean test --console=plain

      # "테스트가 초록"이 아니라 "검증하기로 한 테스트가 실제로 돌았는가"를 본다.
      # 환경변수·키·아티팩트가 없으면 테스트는 조용히 skip되고 빌드는 성공한다 —
      # 그러면 검증하지 않은 기능이 초록불 아래로 나간다. 의도적 예외는 ci/allowed-skips.txt 에
      # 이유와 함께 적는다.
      - name: Check skipped tests (건너뛴 테스트는 통과가 아니다)
        run: python3 tools/check_skipped_tests.py commerce/build/test-results/test ci/allowed-skips.txt

      # 링크는 디렉터리를 옮기면 조용히 깨진다 — 빌드도 테스트도 안 잡고, 읽는 사람만 404를 만난다.
      # commerce/ 재배치에서 실제로 깊이가 어긋난 링크가 나와 검사로 고정했다.
      - name: Check doc links (깨진 링크는 조용하다)
        run: python3 tools/check_doc_links.py

      # consumer-app은 별도 Gradle 프로젝트(독립 빌드)라 위 test에 포함되지 않는다.
      # Kafka 소비자가 깨진 채 머지되지 않도록 CI에서 함께 빌드·검증한다.
      - name: Build consumer-app (독립 프로젝트)
        run: ./gradlew -p commerce/consumer-app build --console=plain

      # 실패해도 리포트는 남겨 원인 파악을 돕는다.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: commerce/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  # 실 MySQL(Testcontainers) 위에서 승인/취소가 DB에 확정되는지 검증하는 통합 테스트.
  # 로컬에선 컨테이너 부팅이 무겁고 hang 이력이 있어 기본 스위트에서 제외하고, Docker가 있는 CI에서만 돈다.
  alert-rules:
    name: alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 알림은 이름이 맞아도 조건식이 틀리면 안 울린다. 그리고 안 울리는 알림은
      # 잘 도는 알림과 화면에서 구별되지 않는다. rate() 를 쓰는 알림은 시계열이
      # 있어야 검사되므로 자바 테스트로는 못 잡고, promtool 이 그 자리를 맡는다.
      - name: Check rule syntax
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool \
            prom/prometheus:latest check rules /m/alert-rules.yml
      - name: Run alert rule tests
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool \
            prom/prometheus:latest test rules /m/tests/alert-rules-test.yml
      # 한 고장이 알림 몇 건을 만드는지 고정한다. 늘어나면 여기서 먼저 보인다.
      - name: Check alert co-firing on a single fault
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool \
            prom/prometheus:latest test rules /m/tests/db-outage-probe.yml
      # 비율 알림은 분모가 작을 때 거짓말을 한다. 표본 바닥과 붕괴 예외를 고정한다.
      - name: Check success-rate sampling floor
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool \
            prom/prometheus:latest test rules /m/tests/success-rate-sampling-test.yml
      # 주간 baseline 알림이 <절대 임계가 안 우는 구간>에서 우는지 본다.
      # 폭을 잘못 잡으면 절대 임계에 가려 혼자서는 영영 안 우는 규칙이 된다.
      - name: Check weekly baseline alert
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool \
            prom/prometheus:latest test rules /m/tests/weekly-baseline-test.yml
      # 억제 규칙은 문법이 틀려도 알림이 안 멈춘다 — <조용히 안 걸릴> 뿐이다.
      # 웹훅 URL 은 실행 시 환경변수로 들어가므로 검사용 더미로 바꿔 넣는다.
      - name: Check alertmanager config
        run: |
          mkdir -p build/am
          sed "s|'\${SLACK_WEBHOOK_URL}'|'https://hooks.slack.com/services/T0/B0/XXXX'|" \
            monitoring/alertmanager.yml > build/am/alertmanager.yml
          docker run --rm -v "$PWD/build/am:/m" --entrypoint amtool \
            prom/alertmanager:latest check-config /m/alertmanager.yml
      # 문법이 맞아도 억제가 걸리는지는 모른다. 살아 있는 alertmanager 에 알림 여섯을
      # 밀어 넣고 몇 건이 안 억제된 채 남는지 센다. 억제는 안 걸려도 조용해서
      # 이 검사가 없으면 소음이 줄었는지 아닌지를 사람이 알 방법이 없다.
      - name: Measure alert inhibition
        run: ./monitoring/tests/run-inhibit-probe.sh

  # 바뀐 파일이 전부 문서면 통합 테스트를 건너뛴다(#274). 문서만 고친 PR 이 18분을 기다렸다.
  # main 푸시는 늘 돈다 — 건너뛴 PR 이 합쳐진 뒤의 상태를 한 번은 실 DB 로 본다.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 tools/ci_changed_code.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  integration-test:
    name: integration test (real DB)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      # Spring Modulith 가 PR 의 base 와 비교해 바뀐 모듈을 찾는다(#278). 그 커밋까지의 이력이 있어야 한다
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # PR: 바뀐 모듈과 그 모듈에 기대는 모듈의 테스트만 돈다(#278). 설정·마이그레이션·빌드 파일이 바뀌면 전부 돈다.
      #     모듈 밖 테스트 공용 코드(testsupport 등)가 바뀌어도 전부 돈다 — Modulith 는 그 변경을 어느 모듈에도 대지 못한다.
      # main 푸시: 최적화를 끄고 전부 돈다 — PR 에서 건너뛴 테스트를 합쳐진 상태로 한 번은 본다.
      - name: Run integration tests (Testcontainers)
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ./gradlew -p commerce integrationTest --console=plain "$(python3 tools/ci_modulith_scope.py "$BASE" "$HEAD")"
          else
            ./gradlew -p commerce integrationTest --console=plain -Dspring.modulith.test.skip-optimizations=true
          fi

      # 통합 테스트도 같은 기준으로 본다. 실제 PG 키가 없어 건너뛰는 계약 테스트는
      # ci/allowed-skips.txt 에 이유와 함께 등록돼 있다. Modulith 가 변경 영향이 없어 건너뛴 것은
      # 테스트 실행 중에 적은 이유 파일로 가려 따로 센다(JUnit XML 에는 이유가 남지 않는다).
      - name: Check skipped tests (건너뛴 테스트는 통과가 아니다)
        run: >-
          python3 tools/check_skipped_tests.py commerce/build/test-results/integrationTest ci/allowed-skips.txt
          --skip-reasons commerce/build/test-results/integrationTest-skip-reasons.txt

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: commerce/build/reports/tests/integrationTest
          if-no-files-found: ignore
          retention-days: 7

  # Dockerfile이 썩지 않게 매 PR에서 이미지를 실제로 굽는다.
  # 여기서 배포하지는 않는다 — 굽는 것과 띄우는 것은 다른 문제고, 띄우는 검증은 로컬 compose가 맡는다.
  docker:
    name: docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 레이어를 GitHub Actions 캐시에 둔다(#281). 런타임 단계의 apt-get 은 베이스 이미지에만 기대므로 한 번 받으면 재사용된다.
      # 매번 Ubuntu 미러에서 받다가 미러 동기화 중에 이 잡이 실패한 적이 있다(#279).
      - uses: docker/setup-buildx-action@v3

      # .dockerignore가 없으면 컨텍스트에 personalization/data(29GB)가 딸려 들어가 빌드가 사실상 불가능하다.
      # 그래서 <굽는 것 자체>가 그 파일의 회귀 테스트다.
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: be-commerce:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      # 독립 Gradle 프로젝트라 이미지도 따로 굽는다(루트 bootJar에 포함되지 않는다).
      - name: Build consumer-app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: commerce/consumer-app/Dockerfile
          push: false
          tags: be-commerce-consumer:ci
          cache-from: type=gha,scope=consumer
          cache-to: type=gha,mode=max,scope=consumer
