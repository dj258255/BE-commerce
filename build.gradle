plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.beomsu'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    // 파라미터 이름 보존 — Jackson의 record 역직렬화(멱등 응답 캐시)에 필요
    options.compilerArgs << '-parameters'
}

repositories {
    mavenCentral()
}

ext {
    springModulithVersion = '1.3.1'
}

dependencies {
    // --- Web / Core ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'   // 어드민 엔드포인트 보호
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'   // JWT 검증(요청당 BCrypt 제거)

    // --- Persistence ---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // --- Schema migration (원장을 지키기 위해 ddl-auto=validate + Flyway로 스키마 관리) ---
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // --- Spring Modulith ---
    // 모듈 경계 검증 + 이벤트 발행 레지스트리(= Transactional Outbox)
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.modulith:spring-modulith-starter-jpa'
    implementation 'org.springframework.modulith:spring-modulith-events-api'
    // Argon2id 해싱 백엔드 — Spring Security의 Argon2PasswordEncoder가 이 구현을 쓴다(ADR-009).
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.springframework.modulith:spring-modulith-events-kafka'   // 결제 이벤트 Kafka 외부화(프로세스 밖 소비자용). spring-kafka를 전이 의존으로 가져온다

    // --- Redis (멱등키 선체크 / 분산락) ---
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // --- 압축 (M6·E6) ---
    // 캐시 값이 커지면 전송·메모리가 문제가 되고, 그때 압축이 이득인 지점을 잰다.
    // 두 코덱을 함께 두는 이유는 "무엇을 쓸까"가 아니라 "몇 KB부터 쓸까"를 정하는 것이 목적이라
    // 코덱별 교차점을 같은 하네스로 비교해야 하기 때문이다(E6).
    implementation 'org.lz4:lz4-java:1.8.0'
    implementation 'org.xerial.snappy:snappy-java:1.1.10.7'

    // --- Observability ---
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'   // /actuator/prometheus
    // 알림 파일이 찾는 지표 이름과 실제 노출 이름을 대조하는 테스트에 필요하다.
    // 이름이 어긋나면 알림은 영원히 안 울리고, 안 울리는 알림은 잘 도는 알림과 구별되지 않는다.
    testImplementation 'io.micrometer:micrometer-registry-prometheus'

    // --- Resilience (서킷브레이커·재시도) ---
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.2.0'

    // --- Dev ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    // --- Test ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'com.h2database:h2'   // 락 전략 동시성 비교 테스트(인메모리, Docker 불필요)
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    // 네트워크 카오스(@Tag("chaos")) — 실제 장애 주입. 기본 스위트에서는 제외하고 chaosTest로만 실행.
    testImplementation 'org.testcontainers:toxiproxy'
    testImplementation 'eu.rekawek.toxiproxy:toxiproxy-java:2.1.7'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    }
}

tasks.named('test') {
    // 기본 스위트는 결정적·빠름을 유지한다: 컨테이너·앱 부팅이 필요한 카오스(@Tag("chaos"))·통합
    // (@Tag("integration")) 테스트는 제외. 순수 단위 테스트(서킷브레이커 포함) + 경량 슬라이스만 돌아
    // CI가 빠르고 재현 가능하다.
    useJUnitPlatform {
        excludeTags 'chaos', 'integration', 'eval', 'capture'
    }

    // ErdDocMatchesSchemaTest는 문서(.md)와 마이그레이션(.sql)을 읽는다. 이 둘을 태스크 입력으로
    // 선언하지 않으면, 문서만 고쳤을 때 Gradle이 up-to-date로 판단해 테스트를 <건너뛴다>.
    // 그러면 CI가 초록불인데 검사는 돌지 않은 상태가 된다 — 실제로 표시를 지워보고 발견했다.
    inputs.dir('docs').withPropertyName('docs').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('src/main/resources/db/migration').withPropertyName('migrations')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}

tasks.register('chaosTest', Test) {
    description = 'Toxiproxy 네트워크 카오스 — 컨테이너 2개 + 앱 부팅이 필요하므로 별도 환경에서 수동 실행'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'chaos'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter('test')
}

// 평가용 케이스 생성기. -Dcorpus.generate=true 일 때만 돈다.
// Gradle 은 명령행 -D 를 테스트 JVM 에 자동으로 넘기지 않는다.
tasks.named('test') {
    systemProperty 'corpus.generate', System.getProperty('corpus.generate', 'false')
    systemProperty 'corpus.out', System.getProperty('corpus.out', "$projectDir/build/corpus")
}

tasks.register('evalTest', Test) {
    description = '모델 평가(홀드아웃) — 로컬 Ollama 와 모델 3종이 필요하므로 수동 실행'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'eval'
    }
    systemProperty 'eval.perFamily', System.getProperty('eval.perFamily', '15')
    // Gradle 은 명령행 -D 를 테스트 JVM 에 자동으로 넘기지 않는다. 넘길 것을 여기 적는다.
    systemProperty 'eval.dump', System.getProperty('eval.dump', 'false')
    systemProperty 'eval.model', System.getProperty('eval.model', 'qwen3:8b')
    testLogging { showStandardStreams = true }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter('test')
}

tasks.register('captureTest', Test) {
    description = '장애 로그 표본 캡처 — 실제로 장애를 일으켜 로그를 받아 적는다. MySQL 컨테이너와 외부 네트워크 필요'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'capture'
    }
    testLogging { showStandardStreams = true }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter('test')
}

tasks.register('integrationTest', Test) {
    description = '실 MySQL(Testcontainers)로 승인/취소가 DB에 확정되는지 검증 — Docker 필요, CI에서 실행'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'integration'
    }
    testLogging { showStandardStreams = true }   // 실측 수치를 콘솔로 봐야 한다
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter('test')
}

// 로컬 실측용 — 런타임 클래스패스를 뽑아 스탠드얼론 측정 프로그램을 돌린다.
tasks.register('printRuntimeClasspath') {
    doLast { println sourceSets.main.runtimeClasspath.asPath }
}

// 성능 실측 — 인프라 초기화부터 리포트까지 한 번에. 누구나 같은 절차로 다시 잴 수 있게 한다.
//
// 이 저장소의 성능 수치는 한 번 틀렸었다(닫힌 루프로 재서 용량을 과소평가). 그 외에도
// 좀비 JVM 때문에 '대조군'이 실은 2회차였던 적, DB 누적으로 회차 비교가 무의미했던 적이 있다.
// 그래서 이 태스크가 막는 것은 느린 코드가 아니라 <잘못된 측정>이다 —
// 회차마다 볼륨을 지우고, 띄운 PID 가 정말 포트를 잡았는지 확인하고, 환경을 리포트에 박는다.
//
//   ./gradlew bench                     # capacity(기본)
//   ./gradlew bench -Pprofile=spike
//   ./gradlew bench -Pprofile=all
//
// bootRun 을 직접 부르지 않고 스크립트에 위임하는 이유: 인프라 기동·헬스 대기·프로세스 검증·
// k6 실행이 Gradle 밖 순서 제어라 태스크 그래프로 표현하면 오히려 흐름이 가려진다.
tasks.register('bench', Exec) {
    description = '성능 실측을 재현 가능한 절차로 실행한다 (Docker·k6 필요)'
    group = 'verification'
    commandLine 'bash', "${projectDir}/tools/bench.sh", (project.findProperty('profile') ?: 'capacity')
}
