# #338 롤링 배포 실측용 로드밸런서. 192.168.65.254:18101  · 192.168.65.254:18102  자리에 "호스트 IPv4:포트" 와 상태(비움 또는 down)가 들어간다.
events {}
http {
  access_log off;
  upstream api {
    server 192.168.65.254:18101 ;
    server 192.168.65.254:18102 ;
    # 요청마다 새 연결을 맺으면 Docker Desktop 의 호스트 중계가 부하에서 연결을 1초 넘게 못 맺어 재시작과 무관한 502 가 났다(#338).
    # 실제 LB 처럼 연결을 재사용한다. 대가: 종료 중인 리플리카가 닫는 재사용 연결에 보낸 POST 는 nginx 가 다시 보내지 않는다
    keepalive 64;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://api;
      # 연결을 맺지 못한 요청은 다른 리플리카로 넘긴다. 요청을 보낸 뒤 끊긴 POST 는 nginx 가 넘기지 않는다(비멱등)
      proxy_next_upstream error timeout;
      proxy_connect_timeout 3s;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 30s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
}
